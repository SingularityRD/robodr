[workspace]
resolver = "2"
members = [
    "crates/robodr-agent",
    "crates/robodr-agentd",
    "crates/robodr-attack-sim",
    "crates/robodr-blackbox",
    "crates/robodr-buildinfo",
    "crates/robodr-capture",
    "crates/robodr-cdr",
    "crates/robodr-commission",
    "crates/robodr-correlate",
    "crates/robodr-demo-soc",
    "crates/robodr-deliverd",
    "crates/robodr-depot",
    "crates/robodr-diode",
    "crates/robodr-events",
    "crates/robodr-executor",
    "crates/robodr-export",
    "crates/robodr-firewall",
    "crates/robodr-firewall-gw",
    "crates/robodr-fleet",
    "crates/robodr-motion",
    "crates/robodr-ocsf",
    "crates/robodr-ops",
    "crates/robodr-pkg",
    "crates/robodr-release",
    "crates/robodr-responder",
    "crates/robodr-ros2-pipeline",
    "crates/robodr-rtps",
    "crates/robodr-seal",
    "crates/robodr-signer",
    # Throughput benchmarks (sensor-box sizing, regression gate).
    "benches",
    # Pulsar-dependent (need pulsar + tokio; cannot build without crates.io):
    "crates/robodr-pulsard",
    "crates/robodr-sensor-ros2",
    "crates/robodr-threat-forward",
]
# Pulsar is a git submodule with its own workspace; keep it out of ours.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
# RoboDR is proprietary (see LICENSE). `LicenseRef-Proprietary` is a valid
# SPDX expression for cargo metadata and the SBOM; every crate is
# `publish = false`, so cargo-deny skips our own crates ([licenses.private])
# and still checks every third-party dependency against deny.toml.
license = "LicenseRef-Proprietary"
# MSRV: 1.87, because `u*::is_multiple_of` (stable since 1.87) is used in
# library code of robodr-capture, -rtps, -blackbox and -commission, and in
# tests/examples of -firewall, -motion and -ros2-pipeline. Pulsar's own floor
# is 1.85 (edition 2024). The toolchain that builds releases is pinned
# separately in rust-toolchain.toml (= Pulsar's pin, 1.98.1 >= this MSRV).
# Every crate inherits it (`rust-version.workspace = true`), so clippy's
# `incompatible_msrv` lint flags std APIs newer than this; CI's `msrv` job
# compiles the pure crates with 1.87 itself.
rust-version = "1.87"
repository = "https://github.com/SingularityRD/robodr"
authors = ["Singularity RD"]

[workspace.dependencies]
# RoboDR crates
robodr-agent = { path = "crates/robodr-agent" }
robodr-agentd = { path = "crates/robodr-agentd" }
robodr-events = { path = "crates/robodr-events" }
robodr-executor = { path = "crates/robodr-executor" }
robodr-export = { path = "crates/robodr-export" }
robodr-rtps = { path = "crates/robodr-rtps" }
robodr-blackbox = { path = "crates/robodr-blackbox" }
robodr-buildinfo = { path = "crates/robodr-buildinfo" }
robodr-capture = { path = "crates/robodr-capture" }
robodr-cdr = { path = "crates/robodr-cdr" }
robodr-commission = { path = "crates/robodr-commission" }
robodr-correlate = { path = "crates/robodr-correlate" }
robodr-deliverd = { path = "crates/robodr-deliverd" }
robodr-depot = { path = "crates/robodr-depot" }
robodr-diode = { path = "crates/robodr-diode" }
robodr-firewall = { path = "crates/robodr-firewall" }
robodr-firewall-gw = { path = "crates/robodr-firewall-gw" }
robodr-fleet = { path = "crates/robodr-fleet" }
robodr-motion = { path = "crates/robodr-motion" }
robodr-ocsf = { path = "crates/robodr-ocsf" }
robodr-pkg = { path = "crates/robodr-pkg" }
robodr-release = { path = "crates/robodr-release" }
robodr-responder = { path = "crates/robodr-responder" }
robodr-ros2-pipeline = { path = "crates/robodr-ros2-pipeline" }
robodr-seal = { path = "crates/robodr-seal" }
robodr-signer = { path = "crates/robodr-signer" }
robodr-sensor-ros2 = { path = "crates/robodr-sensor-ros2" } # Pulsar-dependent
robodr-threat-forward = { path = "crates/robodr-threat-forward" } # Pulsar-dependent

# Pulsar is vendored as a git submodule under vendor/pulsar (see README).
# We build on pulsar-core's module ABI (PulsarModule / SimplePulsarModule).
pulsar-core = { path = "vendor/pulsar/crates/pulsar-core" }
# The pulsard library (PulsarDaemonOpts, pulsar_daemon_run). Features are
# chosen by robodr-pulsard, so upstream defaults (notifiers, openssl) are off.
pulsar = { path = "vendor/pulsar", default-features = false }

# External. Requirements here are deliberately loose (caret); the EXACT
# versions and checksums are pinned by the committed Cargo.lock, which every CI
# and release build uses with --locked (scripts/ci-setup.sh refuses to build
# without it; scripts/ci-check-lockfile.py rejects path/git/unknown sources and
# registry crates without a checksum; docs/BUILD.md "Cargo.lock policy").
# Pulsar's own vendor/pulsar/Cargo.lock is NOT used for our build: Pulsar's
# dependencies are resolved into OUR lock, so review that lock's diff against
# Pulsar's when bumping the submodule.
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
# Ed25519 for robodr-blackbox (audited; replaces the earlier in-crate code).
# `fast` (precomputed basepoint tables), `std` and `zeroize` (signing key
# wiped on drop) are its defaults, spelled out. No `rand_core`: seeds come
# from getrandom(2) via robodr_blackbox::crypto::fill_random.
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast", "std", "zeroize"] }
# SHA-256 / SHA-512 (RustCrypto; the same implementation ed25519-dalek uses
# internally). Replaces the earlier in-crate SHA-256 of robodr-blackbox and
# robodr-ocsf (S10, R8).
sha2 = "0.10"
# Test only (robodr-pkg dev-dependency): builds mixed-order "twin" keys and
# their signatures for the regression test of review 13a finding 2. Already
# in the graph through ed25519-dalek.
curve25519-dalek = { version = "4.1", default-features = false }
# Structural check of delivered Pulsar rule files (robodr-deliverd,
# kind robodr-rules). Already in the lock through Pulsar (toml 1.1); only
# parse + serde, no writer.
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
# Unknown-key tracking for `robodr-ros2-watch --check-config` (pulsar.toml):
# the same pass Pulsar's ModuleConfig::parse makes, so the check warns about
# exactly the keys the daemon ignores. Already in the lock through Pulsar
# (MIT / Apache-2.0).
serde_ignored = "0.1"
# Volatile wipe of secrets and of the hasher state above (already in the graph
# through ed25519-dalek's `zeroize` feature).
zeroize = "1"
# Constant-time tag comparison (already in the graph through ed25519-dalek).
subtle = { version = "2", default-features = false }
# Sealing (robodr-seal, docs/SECURE-DELIVERY.md §7, Sprint 13c), RustCrypto
# and dalek crates, all MIT / Apache-2.0, no C:
# - XChaCha20-Poly1305 for sealed chunks and key wraps (§7.2);
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# - HKDF-SHA256 for the chunk, nonce and wrap keys;
hkdf = "0.12"
# - HMAC-SHA256 (keyed file digests, synthetic nonces); already in the graph
#   through p256's RFC 6979 signing;
hmac = "0.12"
# - X25519 for depot wrapping keys and units without a TPM (§7.7); its
#   curve arithmetic is curve25519-dalek, already in the graph;
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
# - P-256: ECDH to a unit's TPM-resident UWK (the TPM side is
#   `tpm2_ecdhzgen`) and ECDSA for the signed PCR policy
#   (`TPM2_PolicyAuthorize` verifies it in the TPM; TPMs do not do Ed25519).
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdh", "ecdsa", "std"] }
# TLS for robodr-uplink (crates/robodr-export, ingest API client). rustls with
# the `ring` provider only: no aws-lc-rs (CMake + a large C library), no
# `logging` (no `log` output of handshake details), TLS 1.3 and 1.2 (rustls
# offers only AEAD/ECDHE suites in 1.2). The trust anchors are always the
# operator's CA bundle (no webpki-roots / native roots). ring compiles a small
# amount of C and assembly (docs/BUILD.md, "Static (musl) build").
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# rustls' certificate verifier (already in the graph through rustls); used
# directly only to read the end-entity SubjectPublicKeyInfo for SPKI pinning.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc"] }

[profile.release]
# Runs on a robot controller: favour small, predictable binaries.
# Reproducibility (docs/BUILD.md): codegen-units = 1, no incremental, no debug
# info and stripped symbols remove the usual sources of build-to-build drift;
# path prefixes are remapped via RUSTFLAGS by scripts/ci-repro.sh.
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
