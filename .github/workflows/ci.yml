# RoboDR CI. Policy and procedures: docs/BUILD.md.
#
# Every job is required unless marked "informational". Actions are pinned by
# full commit SHA (resolved with `git ls-remote --tags`); the comment gives the
# tag. Tools installed with `cargo install` are pinned by version + --locked.
#
# Air-gapped runners: set the repository variable ROBODR_CRATES_MIRROR to the
# internal sparse index (e.g. sparse+https://crates.mirror.internal/index/)
# and switch `runs-on` to the self-hosted label; scripts/ci-setup.sh then
# routes every crate download through the mirror.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to pick up new RustSec advisories against an unchanged tree.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  ROBODR_CRATES_MIRROR: ${{ vars.ROBODR_CRATES_MIRROR }}
  # Pinned tool versions.
  CARGO_DENY_VERSION: 0.20.2
  CARGO_CYCLONEDX_VERSION: 0.5.9
  CARGO_FUZZ_VERSION: 0.13.1
  # cargo-fuzz needs nightly (-Zsanitizer). Pinned to a dated nightly so fuzz
  # results are comparable run to run; bump deliberately.
  FUZZ_TOOLCHAIN: nightly-2026-09-01
  # Minimum supported Rust version, = [workspace.package] rust-version.
  # 1.87: u*::is_multiple_of (robodr-capture, -rtps, -blackbox, -firewall, -motion).
  MSRV: "1.87.0"

jobs:
  # ---------------------------------------------------------------------------
  lockfile:
    name: Cargo.lock policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Is Cargo.lock committed?
        id: lock
        run: |
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure mirror
        env:
          # This job alone may run without a lock: it produces the bootstrap one.
          ROBODR_ALLOW_MISSING_LOCK: "1"
        run: scripts/ci-setup.sh
      - name: Check committed Cargo.lock has no local/patched sources
        if: steps.lock.outputs.committed == 'true'
        run: python3 scripts/ci-check-lockfile.py Cargo.lock --root .
      - name: No Cargo.lock committed - generate the bootstrap lock
        id: gen
        if: steps.lock.outputs.committed != 'true'
        run: |
          echo "generated=true" >> "$GITHUB_OUTPUT"
          cargo generate-lockfile
          python3 scripts/ci-check-lockfile.py Cargo.lock --root .
          sha256sum Cargo.lock
      - name: Upload generated Cargo.lock
        if: steps.gen.outputs.generated == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Cargo.lock-generated
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 14
      - name: Fail - Cargo.lock must be committed
        # Required job: no build is reproducible or --locked without the lock.
        # Bootstrap procedure (exact commands): docs/BUILD.md "Cargo.lock policy".
        if: steps.lock.outputs.committed != 'true'
        run: |
          echo "::error file=Cargo.lock::Cargo.lock is not committed. Download the 'Cargo.lock-generated' artifact of this run, verify it and commit it (docs/BUILD.md, 'Cargo.lock policy')."
          exit 1

  # ---------------------------------------------------------------------------
  scripts:
    name: CI scripts and Pulsar rules (self-tests, shellcheck, rule validation)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The rule validator calibrates against vendor/pulsar's source and rules.
          submodules: recursive
          # check-doc-facts.py's stamp check resolves "Verified at commit"
          # stamps against the history.
          fetch-depth: 0
          persist-credentials: false
      - name: Python self-tests
        run: |
          python3 scripts/metadata_to_cyclonedx.py --self-test
          python3 scripts/ci-check-lockfile.py --self-test
          python3 scripts/ci-pure-excludes.py --self-test
          python3 scripts/check-focal-units.py --self-test
          python3 scripts/check-packages.py --self-test
          python3 scripts/third_party_notices.py --self-test
          python3 scripts/compare-rebuild.py --self-test
          python3 scripts/sbom-select.py --self-test
          python3 scripts/check-detection-catalog.py --self-test
          python3 scripts/check-doc-facts.py --self-test
          scripts/ci-install-ebpf-toolchain.sh --self-test
      - name: Customer detection catalog in step with the rule catalog
        # docs/customer/detection-catalog.md's generated tables against
        # crates/robodr-ocsf/src/builder.rs (regenerate with --write).
        run: python3 scripts/check-detection-catalog.py
      - name: Document facts in step with the code
        # Contract version, workspace members, fuzz targets, action catalog,
        # "Verified at commit" stamps, evidence links, Pulsar pin.
        run: python3 scripts/check-doc-facts.py
      - name: Package variants consistent (programs, workflows, maintainer scripts)
        # Every robodr-* program classified per package variant, every
        # ROBODR_DEB_REQUIRE list complete, deb and rpm scripts stopping and
        # restarting the same units (scripts/check-packages.py).
        run: python3 scripts/check-packages.py
      - name: systemd-245 unit variants in step with the regular units
        # packaging/systemd/focal/* (robodr-focal package, Ubuntu 20.04 /
        # JetPack 5): same directives as the regular units except the
        # LoadCredential= stand-in, and nothing newer than systemd 245.
        run: python3 scripts/check-focal-units.py
      - name: focal credential helper (robodr-load-credential)
        # Runs a copy of the helper whose /run/credentials is a temporary
        # directory; root because the helper requires it and chowns.
        run: sudo sh scripts/test-load-credential.sh
      - name: Release toolchain pin still matches static.rust-lang.org
        # The independent rebuild (release.yml) installs Rust from the
        # channel manifest pinned by SHA-256; this fails as soon as the pin
        # and rust-toolchain.toml disagree (downloads only the manifest).
        run: ROBODR_TOOLCHAIN_DRY_RUN=1 scripts/ci-install-pinned-toolchain.sh "$RUNNER_TEMP/rust"
      - name: exporter / gateway user migration (deb postinst, rpm post)
        # Runs a copy of migrate_exporter_users against a temporary
        # /var/lib/robodr with stand-in users; root because it chowns.
        run: sudo sh scripts/test-exporter-migration.sh
      - name: robodr-pulsard's external-BTF guard (robodr-btf-check)
        run: sh scripts/test-btf-check.sh
      - name: systemd lifecycle state checks (sealed segments hashed in full)
        run: bash scripts/test-lifecycle-state.sh
      - name: nightly red team assertions (tools/e2e/nightly_redteam_checks.py)
        run: python3 tools/e2e/test_nightly_redteam_checks.py
      - name: Validate Pulsar rules (rules/) against vendor/pulsar
        # One rule that fails to load disables Pulsar's whole rules-engine.
        run: python3 scripts/validate_rules.py --pulsar-src vendor/pulsar --strict
      - name: shellcheck
        # CI scripts and the packaging scripts that run on the robot
        # (install-bundle.sh, the deb maintainer scripts and rpm scriptlets,
        # the focal credential helper) or build the release (build-deb.sh,
        # build-rpm.sh, make-bundle.sh).
        run: shellcheck scripts/*.sh packaging/*.sh packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm packaging/rpm/post packaging/rpm/preun packaging/rpm/postun packaging/focal/robodr-load-credential packaging/btf/robodr-btf-check

  # ---------------------------------------------------------------------------
  pure:
    # Workspace-wide minus the Pulsar-bound members (scripts/ci-pure-excludes.py),
    # so every pure crate is covered without a list to maintain: robodr-agent,
    # -agentd, -blackbox, -capture, -cdr, -commission, -diode, -events,
    # -firewall, -motion, -ocsf, -responder, -ros2-pipeline, -rtps.
    name: Pure crates (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pulsar-core is a path dependency of the workspace, so cargo needs
          # the submodule to load the manifest even when it is excluded.
          submodules: recursive
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: pure
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup (mirror, --locked, Pulsar-bound excludes)
        run: scripts/ci-setup.sh
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        # PURE_EXCLUDES only names members that exist (older cargo errors on
        # `--exclude` of an unknown package), see scripts/ci-pure-excludes.py.
        run: cargo clippy --workspace $PURE_EXCLUDES $CARGO_LOCKED --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace $PURE_EXCLUDES $CARGO_LOCKED
      - name: install-bundle.sh against a real dpkg and rpm (root; update/rollback tests)
        # The test binary is built as the runner user and run as root, so no
        # root-owned files land in target/ (the cache).
        # minisign: the signed-install tests (signature, private extraction,
        # a tampered extracted directory refused). rpm (rpm, rpmbuild,
        # rpm2archive): the RPM bundle tests, in a separate rpm root.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign rpm
          bin=$(cargo test -p robodr-fleet --test packaging $CARGO_LOCKED --no-run 2>&1 |
            sed -n 's/.*Executable tests\/packaging.rs (\(.*\))$/\1/p')
          test -x "$bin"
          sudo env ROBODR_REQUIRE_DPKG_TEST=1 ROBODR_REQUIRE_RPM_TEST=1 "$bin"
      - name: Build did not modify tracked files
        run: |
          git status --porcelain
          test -z "$(git status --porcelain --untracked-files=no)"

  # ---------------------------------------------------------------------------
  pulsar:
    # Required. Builds the crates that link pulsar-core with the system
    # packages Pulsar's own CI installs (vendor/pulsar/Cross.toml: clang-20,
    # lld-20, llvm-20, libssl-dev, libsqlite3-dev). It builds and unit-tests;
    # it does NOT load eBPF into a kernel (that needs a privileged VM job).
    name: Pulsar-bound crates (build, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Pulsar build dependencies
        run: |
          sudo apt-get update
          if sudo apt-get install -y --no-install-recommends clang-20 lld-20 llvm-20; then
            sudo ln -sf /usr/bin/clang-20 /usr/local/bin/clang
            sudo ln -sf /usr/bin/llvm-strip-20 /usr/local/bin/llvm-strip
          else
            echo "::warning::clang-20 not available from the runner's apt sources; using the distribution clang/llvm (Pulsar pins 20)"
            sudo apt-get install -y --no-install-recommends clang lld llvm
          fi
          sudo apt-get install -y --no-install-recommends libssl-dev libsqlite3-dev pkg-config
          clang --version
          llvm-strip --version
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: pulsar
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup (mirror, --locked, Pulsar-bound excludes)
        run: scripts/ci-setup.sh
      - name: Build, lint and test every Pulsar-bound member
        run: |
          pkgs=$(printf '%s\n' $PURE_EXCLUDES | grep -v '^--exclude$' || true)
          if [ -z "$pkgs" ]; then
            echo "::error::no Pulsar-bound workspace members found (expected robodr-sensor-ros2)"
            exit 1
          fi
          args=""
          for p in $pkgs; do args="$args -p $p"; done
          echo "Pulsar-bound members:$args"
          cargo build $args $CARGO_LOCKED --all-targets
          cargo clippy $args $CARGO_LOCKED --all-targets -- -D warnings
          cargo test $args $CARGO_LOCKED

  # ---------------------------------------------------------------------------
  msrv:
    # Required (T89): every crate opts in with `rust-version.workspace = true`,
    # so a change that needs a newer Rust than [workspace.package]
    # rust-version fails here instead of on a customer's pinned toolchain.
    # Checks the pure crates on the MSRV.
    name: MSRV check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install toolchains
        run: |
          rustup toolchain install
          rustup toolchain install "$MSRV" --profile minimal
      - name: Setup (mirror, --locked, Pulsar-bound excludes)
        run: scripts/ci-setup.sh
      - name: cargo check on MSRV
        run: cargo "+$MSRV" check --workspace $PURE_EXCLUDES $CARGO_LOCKED

  # ---------------------------------------------------------------------------
  deny:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tools-deny
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup (mirror)
        run: scripts/ci-setup.sh
      - name: Install cargo-deny
        run: |
          if ! cargo deny --version 2>/dev/null | grep -q " $CARGO_DENY_VERSION"; then
            cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
          fi
      - name: cargo deny check
        # --locked: cargo-deny's internal `cargo metadata` must audit the
        # committed resolution, not silently re-resolve a stale lock.
        run: cargo deny --locked check advisories bans licenses sources
      - name: Third-party notices and eBPF source offer up to date
        # THIRD_PARTY_NOTICES and GPL-2.0-SOURCE-OFFER are committed and
        # shipped as they are (build-deb.sh, build-rpm.sh, make-bundle.sh);
        # regenerated here from Cargo.lock (offline, after the fetch) and the
        # Pulsar submodule, with every crate's licence checked against
        # deny.toml. On failure: python3 scripts/third_party_notices.py, commit.
        run: |
          cargo fetch --locked
          python3 scripts/third_party_notices.py --check
      - name: Cargo.lock unchanged
        run: git diff --exit-code -- Cargo.lock

  # ---------------------------------------------------------------------------
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tools-sbom
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup (mirror)
        run: scripts/ci-setup.sh
      - name: Install cargo-cyclonedx
        run: |
          if ! cargo cyclonedx --version 2>/dev/null | grep -q "$CARGO_CYCLONEDX_VERSION"; then
            cargo install cargo-cyclonedx --locked --version "$CARGO_CYCLONEDX_VERSION"
          fi
      - name: Generate SBOMs
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          # Primary: cargo-cyclonedx, one SBOM per crate.
          SBOM_TOOL=cyclonedx scripts/sbom.sh dist/sbom/cyclonedx
          # Fallback generator, run too so the air-gapped path stays tested.
          SBOM_TOOL=metadata CARGO_METADATA_ARGS="$CARGO_LOCKED" scripts/sbom.sh dist/sbom/metadata
      - name: Cargo.lock unchanged
        run: git diff --exit-code -- Cargo.lock
      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: dist/sbom
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  fuzz:
    name: Fuzz smoke (60 s per target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Detect fuzz/ targets
        id: detect
        run: |
          if [ -f fuzz/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no fuzz/ directory; fuzz smoke skipped"
          fi
      - name: Install toolchains
        if: steps.detect.outputs.present == 'true'
        run: |
          rustup toolchain install
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      # Mirror BEFORE any `cargo install`, so tool sources also come from it.
      - name: Setup (mirror)
        if: steps.detect.outputs.present == 'true'
        run: scripts/ci-setup.sh
      - name: Install cargo-fuzz
        if: steps.detect.outputs.present == 'true'
        run: cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      - name: Run each fuzz target for 60 s
        # fuzz/ is its own unpublished workspace with no committed lock: its
        # binaries are never shipped, so it resolves fresh (through the mirror)
        # and is excluded from the --locked policy (docs/BUILD.md).
        if: steps.detect.outputs.present == 'true'
        run: |
          targets=$(cargo "+$FUZZ_TOOLCHAIN" fuzz list)
          if [ -z "$targets" ]; then echo "::error::fuzz/ exists but has no targets"; exit 1; fi
          for t in $targets; do
            echo "::group::fuzz $t"
            cargo "+$FUZZ_TOOLCHAIN" fuzz run "$t" -- -max_total_time=60
            echo "::endgroup::"
          done
      - name: Upload crash artifacts
        if: failure() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  reproducible:
    name: Reproducible release build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # Shallow is enough: SOURCE_DATE_EPOCH is HEAD's commit time.
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Pinned C compiler (clang 18.1.3, ring's C/assembly; scripts/c-toolchain.sh)
        run: scripts/ci-install-clang.sh
      - name: Setup (mirror)
        run: scripts/ci-setup.sh
      - name: Build twice from different paths and compare robodr-* binaries
        env:
          # The workspace ships robodr-* binaries; "nothing to compare" is a failure.
          REPRO_REQUIRE_BINARIES: "1"
        run: scripts/ci-repro.sh dist/repro
      - name: Upload binary hashes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sha256-${{ github.sha }}
          path: dist/repro/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  static:
    # Static (musl) build of the pure binaries for hosts below glibc 2.39 /
    # systemd 247, e.g. Unitree EDU computers on JetPack 5 (Ubuntu 20.04,
    # glibc 2.31, systemd 245): docs/BUILD.md "Static (musl) build". Both
    # targets are cross-linked with rust-lld on the x86-64 runner (the only C
    # is ring's, robodr-uplink's TLS crypto, built with clang); the arm64
    # binaries are smoke-run under
    # qemu-user. Then the robodr-focal .deb is assembled and checked.
    name: Static musl build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pulsar-core is a path dependency of the workspace manifest.
          submodules: recursive
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml) and the musl target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - name: Setup (mirror, --locked, Pulsar-bound excludes)
        run: scripts/ci-setup.sh
      - name: Linker (rust-lld, self-contained musl)
        run: echo "CARGO_TARGET_$(printf '%s' "$TARGET" | tr 'a-z-' 'A-Z_')_LINKER=rust-lld" >> "$GITHUB_ENV"
      - name: Pinned C compiler (clang 18.1.3, ring's C/assembly; scripts/c-toolchain.sh)
        # ci-repro.sh / build-static.sh set CC_<triple> to it and fail on
        # any other compiler (no fallback to cc).
        run: scripts/ci-install-clang.sh
      - name: Reproducibility proof (pure binaries, two paths, musl)
        env:
          REPRO_REQUIRE_BINARIES: "1"
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: scripts/ci-repro.sh dist/repro-static
      - name: Static build, checked (no interpreter, no shared library)
        run: scripts/build-static.sh "$TARGET" --out "dist/static/$TARGET"
      - name: Built binaries == reproduced binaries
        run: (cd "dist/static/$TARGET" && sha256sum --strict -c "$GITHUB_WORKSPACE/dist/repro-static/SHA256SUMS")
      - name: Smoke run (native, or qemu-user for arm64)
        run: |
          run=""
          if [ "$ARCH" = arm64 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends qemu-user-static
            run=qemu-aarch64-static
          fi
          for b in robodr-agentd robodr-commission robodr-ros2-watch robodr-uplink robodr-kafka-publish robodr-enroll robodr-executor robodr-firewall-gw robodr-deliverd robodr-seal robodr-depot; do
            $run "dist/static/$TARGET/$b" --version
          done
          $run "dist/static/$TARGET/robodr-blackbox" keygen --out "$RUNNER_TEMP/k"
          test -s "$RUNNER_TEMP/k.pub"
      - name: robodr-focal .deb (static binaries, systemd 245 units)
        env:
          ROBODR_DEB_REQUIRE: robodr-agentd robodr-blackbox robodr-diode-pack robodr-diode-unpack robodr-spool-export robodr-kafka-publish robodr-uplink robodr-enroll robodr-executor robodr-firewall-gw robodr-deliverd robodr-seal robodr-depot
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          deb=$(packaging/build-deb.sh --variant focal --bin-dir "dist/static/$TARGET" --arch "$ARCH" --out dist/focal)
          dpkg-deb -I "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = robodr-focal
          test "$(dpkg-deb -f "$deb" Depends)" = "systemd (>= 245)"
          dpkg-deb -c "$deb" | grep -q ' ./usr/lib/robodr/robodr-load-credential$'
          if dpkg-deb -c "$deb" | grep -q 'robodr-pulsard'; then
            echo "::error::robodr-focal must not contain robodr-pulsard"
            exit 1
          fi
          python3 scripts/check-packages.py --deb "$deb"
      - name: Build did not modify tracked files
        run: test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload the robodr-focal package (package-smoke)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-focal-${{ matrix.arch }}-${{ github.sha }}
          path: dist/focal/*.deb
          if-no-files-found: error
          retention-days: 14
      - name: Upload binary hashes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-sha256-${{ matrix.target }}-${{ github.sha }}
          path: dist/static/${{ matrix.target }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  package-deb:
    # The robodr .deb exactly as release.yml builds it: in an Ubuntu 22.04
    # container (glibc 2.35, the oldest userland the package supports, so it
    # installs on Ubuntu 22.04 / NVIDIA JetPack 6, Debian 12 and newer),
    # natively per architecture, robodr-pulsard included (clang-20 from
    # apt.llvm.org, key pinned by fingerprint). Reproducibility proof in the
    # same userland, Depends from dpkg-shlibdeps with the libc6 floor checked
    # (<= 2.35), package consistency; package-smoke installs it for real.
    # (scripts/deb-install-smoke.sh needs systemd-analyze verify --root,
    # systemd >= 250: not in this container.) docs/BUILD.md "Release build
    # userlands".
    name: robodr .deb, Ubuntu 22.04 userland (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: docker.io/library/ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
      # PATH spelled out: a step after a $GITHUB_PATH addition runs with
      # PATH = <additions>:<PATH from the container's Config.Env>, and the
      # Rocky Linux image sets no PATH there, so the runner's
      # `docker exec ... sh` found no shell ("exec: sh: executable file
      # not found"). Same value as the Ubuntu image's (and the shells') default.
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: git for actions/checkout (the image has none)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build userland (base packages, Rust, pinned clang, eBPF toolchain)
        run: |
          scripts/ci-container-prep.sh
          scripts/ci-install-rustup.sh
          scripts/ci-install-clang.sh
          scripts/ci-install-ebpf-toolchain.sh
      - name: Setup (mirror, --locked, Pulsar-bound excludes)
        run: scripts/ci-setup.sh
      - name: Reproducibility proof (pure binaries, two paths)
        env:
          REPRO_REQUIRE_BINARIES: "1"
        run: scripts/ci-repro.sh dist/repro
      - name: Release build (scripts/ci-release-build.sh, as release.yml)
        run: scripts/ci-release-build.sh
      - name: Built pure binaries == reproduced binaries
        run: (cd target/release && sha256sum --strict -c "$GITHUB_WORKSPACE/dist/repro/SHA256SUMS")
      - name: robodr .deb (libc6 floor <= 2.35), consistency
        env:
          ROBODR_DEB_REQUIRE: robodr-pulsard robodr-agentd robodr-blackbox robodr-diode-pack robodr-diode-unpack robodr-spool-export robodr-kafka-publish robodr-uplink robodr-enroll robodr-executor robodr-firewall-gw robodr-anchor-receiver robodr-deliverd robodr-seal robodr-depot
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          deb=$(packaging/build-deb.sh --bin-dir target/release --arch "$ARCH" --out dist/pkg)
          scripts/check-glibc-floor.sh "$deb"
          python3 scripts/check-packages.py --deb "$deb"
      - name: Build did not modify tracked files
        run: test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload the package (package-smoke)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-deb-${{ matrix.arch }}-${{ github.sha }}
          path: dist/pkg/*.deb
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  package-rpm:
    # The robodr .rpm exactly as release.yml builds it: in a Rocky Linux 9
    # container (glibc 2.34, OpenSSL 3, SQLite 3.34: the oldest RPM userland
    # supported, so it installs on RHEL / Rocky / Alma 9 and Fedora),
    # natively per architecture, robodr-pulsard included (AppStream clang).
    # Same file tree as the .deb (build-deb.sh --stage-only), rpm's generated
    # GLIBC requirement checked (<= 2.34), package consistency.
    name: robodr .rpm, Rocky Linux 9 userland (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/rockylinux/rockylinux:9@sha256:8101994123cf3d0a8fee517bee7f39e555c7d92bd2d9eb3303cc988a0eeed00f
      # PATH spelled out: a step after a $GITHUB_PATH addition runs with
      # PATH = <additions>:<PATH from the container's Config.Env>, and the
      # Rocky Linux image sets no PATH there, so the runner's
      # `docker exec ... sh` found no shell ("exec: sh: executable file
      # not found"). Same value as the Ubuntu image's (and the shells') default.
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: git for actions/checkout
        run: dnf install -y --setopt=install_weak_deps=False git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build userland (base packages, Rust, pinned clang, eBPF toolchain)
        run: |
          scripts/ci-container-prep.sh
          scripts/ci-install-rustup.sh
          scripts/ci-install-clang.sh
          scripts/ci-install-ebpf-toolchain.sh
      - name: Setup (mirror, --locked, Pulsar-bound excludes)
        run: scripts/ci-setup.sh
      - name: Reproducibility proof (pure binaries, two paths)
        env:
          REPRO_REQUIRE_BINARIES: "1"
        run: scripts/ci-repro.sh dist/repro
      - name: Release build (scripts/ci-release-build.sh, as release.yml)
        run: scripts/ci-release-build.sh
      - name: Built pure binaries == reproduced binaries
        run: (cd target/release && sha256sum --strict -c "$GITHUB_WORKSPACE/dist/repro/SHA256SUMS")
      - name: robodr .rpm (GLIBC requirement <= 2.34), consistency
        env:
          ROBODR_DEB_REQUIRE: robodr-pulsard robodr-agentd robodr-blackbox robodr-diode-pack robodr-diode-unpack robodr-spool-export robodr-kafka-publish robodr-uplink robodr-enroll robodr-executor robodr-firewall-gw robodr-anchor-receiver robodr-deliverd robodr-seal robodr-depot
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          rpm=$(packaging/build-rpm.sh --bin-dir target/release --arch "$ARCH" --out dist/pkg)
          scripts/check-glibc-floor.sh "$rpm"
          python3 scripts/check-packages.py --rpm "$rpm"
      - name: Build did not modify tracked files
        run: test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload the package (package-smoke)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-rpm-${{ matrix.arch }}-${{ github.sha }}
          path: dist/pkg/*.rpm
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  package-smoke:
    # Every package installed with the target distribution's own package
    # manager, in a fresh container per distribution (scripts/
    # pkg-smoke-matrix.sh): robodr .deb on Debian 12 / Ubuntu 22.04 / 24.04,
    # robodr-focal on Ubuntu 20.04 / 22.04, robodr .rpm on Rocky Linux 9 /
    # Fedora 42; Depends / Requires resolved by apt / dnf, maintainer
    # scripts run, every program started on that glibc, units verified by
    # that systemd, reinstall / remove / purge. Then the three packages of
    # the architecture are compared with each other (check-packages.py).
    name: Package install smoke (${{ matrix.arch }})
    needs: [package-deb, package-rpm, static]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this architecture's packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-*-${{ matrix.arch }}-${{ github.sha }}
          merge-multiple: true
          path: dist/pkgs
      - name: The three packages agree (paths, modes, content)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm
          ls -l dist/pkgs
          python3 scripts/check-packages.py --deb dist/pkgs/robodr_*.deb --deb dist/pkgs/robodr-focal_*.deb --rpm dist/pkgs/robodr-*.rpm
      - name: Install smoke per distribution
        run: scripts/pkg-smoke-matrix.sh dist/pkgs
