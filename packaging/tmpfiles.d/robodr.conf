# RoboDR directories (systemd-tmpfiles). Applied at boot and by the package's
# postinst; `d` also corrects mode and ownership of existing directories, so
# a drift (e.g. a chmod by hand) is reset at every boot.
# Rationale for every mode: packaging/README.md, "Filesystem layout".
#
# Type Path                              Mode User   Group  Age
d      /etc/robodr                       0750 root   robodr -
# Key material: root only. Services receive keys via systemd LoadCredential=,
# so not even the robodr user can read this directory.
d      /etc/robodr/keys                  0700 root   root   -
d      /etc/robodr/keys/retired          0700 root   root   -
d      /var/lib/robodr                   0750 root   robodr -
d      /var/lib/robodr/blackbox          0750 root   robodr -
d      /var/lib/robodr/blackbox/agentd   0750 robodr robodr -
d      /var/lib/robodr/blackbox/pulsard  0750 root   robodr -
d      /var/lib/robodr/spool             0750 root   robodr -
d      /var/lib/robodr/spool/agentd      0750 robodr robodr -
d      /var/lib/robodr/spool/pulsard     0750 root   robodr -
# Profile anti-rollback state (robodr-profile-state/v1), one directory per
# daemon so neither can rewrite the other's floor (a robodr-owned directory
# lets the robodr user replace any file in it).
d      /var/lib/robodr/profile-state         0750 robodr robodr -
d      /var/lib/robodr/profile-state-pulsard 0750 root   robodr -
# Control-plane state of robodr-agentd (control_plane.state_dir: request
# journal, replay store, evidence exports): private to the daemon (agentd
# refuses a state_dir with group or other bits).
d      /var/lib/robodr/control-plane         0750 root   robodr -
d      /var/lib/robodr/control-plane/agentd  0700 robodr robodr -
# Operator workspaces (root-only tools: commissioning, export, archive).
d      /var/lib/robodr/commission        0750 root   robodr -
d      /var/lib/robodr/export            0750 root   robodr -
# Exporter units (User=robodr): diode outbox and the exporters' own state.
d      /var/lib/robodr/export/diode          0750 robodr robodr -
d      /var/lib/robodr/export/spool-export   0750 robodr robodr -
d      /var/lib/robodr/export/kafka-publish  0750 robodr robodr -
d      /var/lib/robodr/export/uplink         0750 robodr robodr -
d      /var/lib/robodr/archive           0750 root   robodr -
# Release packages kept for rollback (install-bundle.sh).
d      /var/lib/robodr/releases          0750 root   root   -
