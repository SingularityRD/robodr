# RoboDR directories (systemd-tmpfiles). Applied at boot and by the package's
# postinst; `d` also corrects mode and ownership of existing directories, so
# a drift (e.g. a chmod by hand) is reset at every boot.
# Rationale for every mode: packaging/README.md, "Filesystem layout".
#
# Type Path                              Mode User   Group  Age
d      /etc/robodr                       0750 root   robodr -
# Key material: root only. Services receive keys via systemd LoadCredential=,
# so not even the robodr user can read this directory.
d      /etc/robodr/keys                  0700 root   root   -
d      /etc/robodr/keys/retired          0700 root   root   -
d      /var/lib/robodr                   0750 root   robodr -
d      /var/lib/robodr/blackbox          0750 root   robodr -
# agentd's own trees belong to its own user (review H1), group robodr.
d      /var/lib/robodr/blackbox/agentd   0750 robodr-agentd robodr -
d      /var/lib/robodr/blackbox/pulsard  0750 root   robodr -
d      /var/lib/robodr/blackbox/deliverd 0750 root   robodr -
d      /var/lib/robodr/spool             0750 root   robodr -
# agentd's findings spool: agentd (robodr-agentd) writes, the exporters
# (robodr) read and rename ready/ -> acked/ / rejected/ through the robodr
# group. Setgid, so every record and directory in it gets group robodr.
# The spool root is not writable by the exporters (only the queues are);
# robodr-deliverd (root) adds its records through directory descriptors.
d      /var/lib/robodr/spool/agentd          2750 robodr-agentd robodr -
d      /var/lib/robodr/spool/agentd/ready    2770 robodr-agentd robodr -
d      /var/lib/robodr/spool/agentd/acked    2770 robodr-agentd robodr -
d      /var/lib/robodr/spool/agentd/rejected 2770 robodr-agentd robodr -
d      /var/lib/robodr/spool/pulsard     0750 root   robodr -
# Profile anti-rollback state (robodr-profile-state/v1), one directory per
# daemon so neither can rewrite the other's floor (a robodr-owned directory
# lets the robodr user replace any file in it).
d      /var/lib/robodr/profile-state         0750 robodr-agentd robodr -
d      /var/lib/robodr/profile-state-pulsard 0750 root   robodr -
# Control-plane state of robodr-agentd (control_plane.state_dir: request
# journal, replay store, evidence exports): private to the daemon (agentd
# refuses a state_dir with group or other bits).
d      /var/lib/robodr/control-plane         0750 root   robodr -
d      /var/lib/robodr/control-plane/agentd  0700 robodr-agentd robodr -
# Operator workspaces (root-only tools: commissioning, export, archive).
d      /var/lib/robodr/commission        0750 root   robodr -
d      /var/lib/robodr/export            0750 root   robodr -
# Exporter units, each with a user of its own (group robodr): the diode
# outbox and each exporter's own state, writable by that exporter only.
d      /var/lib/robodr/export/diode          0750 robodr-spool  robodr -
d      /var/lib/robodr/export/spool-export   0750 robodr-spool  robodr -
d      /var/lib/robodr/export/kafka-publish  0750 robodr-kafka  robodr -
d      /var/lib/robodr/export/uplink         0750 robodr-uplink robodr -
d      /var/lib/robodr/archive           0750 root   robodr -
# executor v1 journal (robodr-executor, User=robodr-exec): active actions and
# their TTL deadlines. Private to the executor.
d      /var/lib/robodr/executor          0700 robodr-exec robodr -
# Fleet lifecycle state of robodr-enroll (root-only tool): enrollment,
# rotation journals, staged profiles, the fleet journal (black box).
d      /var/lib/robodr/fleet             0700 root   root   -
# robodr-deliverd (root): state, trust anchor, content-addressed store and
# imported packs (private); the media drop (untrusted packs, root only);
# the install roots of delivered files, config and Pulsar rules (read by
# the robot's software, written by robodr-deliverd only).
d      /var/lib/robodr/deliverd          0700 root   root   -
d      /var/lib/robodr/deliverd-media    0700 root   root   -
d      /opt/robodr-delivered             0755 root   root   -
d      /etc/robodr-delivered             0755 root   root   -
d      /etc/robodr-delivered-rules       0755 root   root   -
# robodr-depot (Sprint 14a, depot box only): its state (database, store,
# deployments, unit CA) and its configuration and keys belong to its own
# user; nothing else on the box reads them.
d      /var/lib/robodr/depot             0700 robodr-depot robodr-depot -
d      /etc/robodr-depot                 0750 root   robodr-depot -
d      /etc/robodr-depot/keys            0700 robodr-depot robodr-depot -
# Release packages kept for rollback (install-bundle.sh).
d      /var/lib/robodr/releases          0750 root   root   -
