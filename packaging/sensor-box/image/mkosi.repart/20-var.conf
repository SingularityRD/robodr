# Writable state: /var (dpkg database, journal, RoboDR black box and spool)
# and, through the overlay of robodr-etc-overlay.service, /etc/robodr
# (configuration and the keys generated at first boot). Mounted by
# /etc/fstab (label var), nodev,nosuid. Not encrypted by this recipe: bind
# it to the box's TPM with LUKS on the reference hardware (README.md, B7).
[Partition]
Type=var
Format=ext4
Label=var
CopyFiles=/var:/
SizeMinBytes=8G
