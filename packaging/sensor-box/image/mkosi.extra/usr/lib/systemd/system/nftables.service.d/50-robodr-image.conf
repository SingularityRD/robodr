# RoboDR sensor box image: the host firewall never depends on
# robodr-image-early having succeeded. robodr-nft-load loads
# /etc/robodr/nftables.conf, or the shipped strict default when that file
# is missing or refused (and then fails the unit visibly).
[Unit]
Wants=robodr-image-early.service
After=robodr-image-early.service

[Service]
ExecStart=
ExecStart=/usr/lib/robodr-image/robodr-nft-load
ExecReload=
ExecReload=/usr/lib/robodr-image/robodr-nft-load
