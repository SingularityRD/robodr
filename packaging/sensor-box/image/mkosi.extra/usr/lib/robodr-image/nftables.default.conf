#!/usr/sbin/nft -f
# RoboDR sensor box: STRICT DEFAULT host firewall, installed at first boot
# as /etc/robodr/nftables.conf (/etc/nftables.conf points there) until the
# site replaces it with its own, from
# /usr/share/doc/robodr/examples/sensor-box/nftables.conf.example (uplink
# to the SOC or brokers, NTP, admin network). Until then the box accepts
# nothing but loopback and DHCP/NTP replies, and sends nothing but DHCP
# and NTP: it records findings, but delivers none.
flush ruleset

table inet robodr_sensor_box {
    chain input {
        type filter hook input priority filter; policy drop;
        iif "lo" accept
        ct state invalid drop
        ct state established,related accept
        udp sport 67 udp dport 68 accept
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
    chain output {
        type filter hook output priority filter; policy drop;
        oif "lo" accept
        ct state invalid drop
        ct state established,related accept
        udp sport 68 udp dport 67 accept
        udp dport 123 accept
    }
}
