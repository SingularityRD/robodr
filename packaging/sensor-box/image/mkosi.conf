# RoboDR sensor box image (mkosi >= 24). Build only through build-image.sh:
# it verifies the signed RoboDR offline bundle first and hands mkosi the
# verified .deb as an extra tree (/var/cache/robodr-image/).
#
# Result: a GPT disk image with an ESP (systemd-boot), a READ-ONLY root
# (GPT read-only flag + "ro" on the kernel command line) and a writable
# /var (label "var"). Keys are NOT in the image: robodr-image-late.service
# generates them on the box at first boot (robodr-setup init). See README.md.

[Distribution]
Distribution=ubuntu
Release=noble
Repositories=main,universe

[Output]
Format=disk
ImageId=robodr-sensor-box
Output=robodr-sensor-box
CompressOutput=zstd

[Content]
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=ro console=tty0 console=ttyS0,115200 systemd.show_status=error
# Minimal: no desktop, no compiler, no SSH server, no radios' firmware
# beyond the generic kernel's. Admin is on the console (or add an SSH server
# with keys-only login and host keys generated on the box, never in the
# image).
Packages=
        linux-image-generic
        systemd
        systemd-boot
        systemd-timesyncd
        udev
        dbus
        nftables
        iproute2
        ca-certificates
        minisign
        tpm2-tools
        tcpdump
WithDocs=yes
CleanPackageMetadata=yes
# No password for root: console login is locked until the integrator sets
# credentials through their own provisioning (or systemd-firstboot).
RootPassword=!*
Locale=C.UTF-8
Timezone=UTC
