# RoboDR system users (systemd-sysusers).
#
# robodr-agentd runs robodr-agentd (the decision chain, its black box and
# the robot's live safety state) and owns nothing else. It is a user of its
# own, distinct from the exporters (review H1): robodr-deliverd accepts the
# safety state only from this uid (SO_PEERCRED on agentd's status socket),
# and agentd accepts safety reports only from root, itself and the
# configured feeders. It is a member of the robodr group: the shared
# configuration (/etc/robodr), agentd's findings spool (group robodr,
# setgid) and the executor's socket.
#
# robodr runs the findings exporters (robodr-spool-export,
# robodr-kafka-publish, robodr-uplink) and robodr-firewall-gw. Two of them
# face the network; none of them can write agentd's black box, its state or
# its sockets. robodr-pulsard runs as root (Pulsar requires euid 0) with a
# bounded capability set and is a member of no extra group.
#
# robodr-exec runs robodr-executor (executor v1), the only RoboDR process
# with CAP_NET_ADMIN (granted by its unit, not by membership); its primary
# group in the unit is robodr so agentd can reach its socket.
#
# robodr-safety is the group of the safety-PLC gateway that reports the
# robot's safety state to agentd (safety_feed.socket with socket_mode 0660,
# socket_group and allowed_gids = this group's gid; agentd and the gateway
# get it with SupplementaryGroups=, docs/OPERATIONS.md section 11.2). No
# RoboDR service is in it by default.
#
# No login shell, no password; homes are root-owned state directories.
#
# Type Name          ID Description                                Home                     Shell
u      robodr        -  "RoboDR exporters"                         /var/lib/robodr          /usr/sbin/nologin
u      robodr-agentd -  "RoboDR agent (robodr-agentd)"             /var/lib/robodr          /usr/sbin/nologin
m      robodr-agentd robodr
u      robodr-exec   -  "RoboDR executor (robodr-executor)"        /var/lib/robodr/executor /usr/sbin/nologin
g      robodr-safety -
