# RoboDR system user (systemd-sysusers). Runs robodr-agentd; owns nothing
# else. No login shell, no password, home is the (root-owned) state dir.
# robodr-pulsard runs as root (Pulsar requires euid 0) with a bounded
# capability set and is a member of no extra group.
#
# Type Name   ID Description                         Home            Shell
u      robodr -  "RoboDR agent (robodr-agentd)"      /var/lib/robodr /usr/sbin/nologin
