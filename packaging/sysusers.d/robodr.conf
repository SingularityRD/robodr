# RoboDR system users (systemd-sysusers).
#
# robodr-agentd runs robodr-agentd (the decision chain, its black box and
# the robot's live safety state) and owns nothing else. It is a user of its
# own, distinct from the exporters (review H1): robodr-deliverd accepts the
# safety state only from this uid (SO_PEERCRED on agentd's status socket),
# and agentd accepts safety reports only from root, itself and the
# configured feeders. It is a member of the robodr group: the shared
# configuration (/etc/robodr), agentd's findings spool (group robodr,
# setgid) and the executor's socket.
#
# robodr owns the shared group robodr (configuration, agentd's findings
# spool) and runs no service any more.
#
# Every network-facing service has a user of its own (review: a shared uid
# let any of them read the others' /run/credentials/<unit>/ copies, e.g.
# the diode signing key, and rewrite their state):
#   robodr-spool   robodr-spool-export  (diode signing key, diode outbox)
#   robodr-kafka   robodr-kafka-publish (Kafka client key / SASL password)
#   robodr-uplink  robodr-uplink        (uplink signing key)
#   robodr-gw      robodr-firewall-gw   (the inline Motion Firewall gateway)
# Their units run them with Group=robodr (the spool queues' setgid group
# and the configuration under /etc/robodr); none of them can write agentd's
# black box, its state or its sockets, nor another one's state or
# credentials. The package's maintainer scripts move the state an earlier
# release wrote as robodr to its new owner (OPERATIONS.md 11.6).
# robodr-pulsard runs as root (Pulsar requires euid 0) with a bounded
# capability set and is a member of no extra group.
#
# robodr-exec runs robodr-executor (executor v1), the only RoboDR process
# with CAP_NET_ADMIN (granted by its unit, not by membership); its primary
# group in the unit is robodr so agentd can reach its socket.
#
# robodr-safety is the group of the safety-PLC gateway that reports the
# robot's safety state to agentd (safety_feed.socket with socket_mode 0660,
# socket_group and allowed_gids = this group's gid; agentd and the gateway
# get it with SupplementaryGroups=, docs/OPERATIONS.md section 11.2). No
# RoboDR service is in it by default.
#
# robodr-depot runs robodr-depot (Sprint 14a, the site depot inside the air
# gap; a depot box, never a robot): it owns the depot's state and keys and
# is a member of the robodr group only to add robot.depot.* records to the
# box's agentd spool. Operators run its commands as this user
# (`runuser -u robodr-depot -- robodr-depot ...`, OPERATIONS.md section 13).
#
# No login shell, no password; homes are root-owned state directories.
#
# Type Name          ID Description                                Home                     Shell
u      robodr        -  "RoboDR shared group owner (no service)"   /var/lib/robodr          /usr/sbin/nologin
u      robodr-spool  -  "RoboDR diode exporter (robodr-spool-export)" /var/lib/robodr       /usr/sbin/nologin
u      robodr-kafka  -  "RoboDR Kafka publisher (robodr-kafka-publish)" /var/lib/robodr     /usr/sbin/nologin
u      robodr-uplink -  "RoboDR uplink (robodr-uplink)"            /var/lib/robodr          /usr/sbin/nologin
u      robodr-gw     -  "RoboDR firewall gateway (robodr-firewall-gw)" /var/lib/robodr      /usr/sbin/nologin
u      robodr-agentd -  "RoboDR agent (robodr-agentd)"             /var/lib/robodr          /usr/sbin/nologin
m      robodr-agentd robodr
u      robodr-exec   -  "RoboDR executor (robodr-executor)"        /var/lib/robodr/executor /usr/sbin/nologin
g      robodr-safety -
u      robodr-depot  -  "RoboDR site depot (robodr-depot)"        /var/lib/robodr/depot    /usr/sbin/nologin
m      robodr-depot  robodr
