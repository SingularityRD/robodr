# cargo-fuzz (libFuzzer) harnesses for the RoboDR parsers. NOT a member of
# the main workspace: the empty [workspace] table below makes this its own
# workspace root, so `cargo build --workspace` at the repo root never sees it
# (and never needs libfuzzer-sys or a nightly toolchain). See README.md.
#
# Every target except parse_datagram is a thin wrapper around a harness in
# harness/ that the owning crate's tests/fuzz_smoke.rs also runs (std only,
# deterministic mutator), so the targets are exercised in normal CI too.
[package]
name = "robodr-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "LicenseRef-Proprietary"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
robodr-agent = { path = "../crates/robodr-agent" }
robodr-blackbox = { path = "../crates/robodr-blackbox" }
robodr-capture = { path = "../crates/robodr-capture" }
robodr-cdr = { path = "../crates/robodr-cdr" }
robodr-commission = { path = "../crates/robodr-commission" }
robodr-events = { path = "../crates/robodr-events" }
robodr-firewall = { path = "../crates/robodr-firewall" }
robodr-fleet = { path = "../crates/robodr-fleet" }
robodr-ocsf = { path = "../crates/robodr-ocsf" }
robodr-ros2-pipeline = { path = "../crates/robodr-ros2-pipeline" }
robodr-rtps = { path = "../crates/robodr-rtps" }

[[bin]]
name = "parse_datagram"
path = "fuzz_targets/parse_datagram.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pcap_reader"
path = "fuzz_targets/pcap_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cdr_unitree"
