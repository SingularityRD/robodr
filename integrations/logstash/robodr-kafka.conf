# RoboDR findings: Kafka -> signature verification -> Elasticsearch.
#
# Stage 1 (this file, pipeline "robodr-kafka-in"): read the topic with the
# record value kept as a raw string and the headers kept, and write NDJSON
# {"value": ..., "headers": [[name, value]]} for robodr_verify.py. The value
# must not be parsed here: the signature covers its exact bytes.
#
# Stage 2: robodr_verify.py --keyring keys.json < in.ndjson > verified.ndjson
# (or as a pipe between two Logstash pipelines). Nothing here schedules it:
# run it on each spool file yourself (cron, a systemd timer).
#
# Limit: the Kafka input stores headers in a hash ([@metadata][kafka][headers]),
# one value per name, so a record carrying robodr-finding-sig twice reaches
# robodr_verify.py with one of them. The contract's "exactly one header, else
# reject" check cannot fire on this path; the header that remains must still
# verify over the exact value bytes.
#
# Stage 3 (pipeline "robodr-verified-out"): index the verified findings into
# the data stream through the ingest pipeline robodr-findings-verified, which
# keeps the verifier's robodr_verification and maps the rest to ECS. Only
# robodr_verify.py output may use it: robodr-findings (for anything else)
# discards any status a finding carries.
#
# Replace the <...> placeholders. TLS and SASL settings follow your broker.

input {
  kafka {
    id => "robodr-kafka-in"
    bootstrap_servers => "<broker:9093>"
    topics => ["robodr.findings"]
    group_id => "logstash-robodr"
    codec => plain { charset => "UTF-8" }
    decorate_events => "extended"
    security_protocol => "SSL"
    ssl_truststore_location => "<truststore.jks>"
    ssl_truststore_password => "<password>"
    tags => ["robodr-raw"]
  }
}

filter {
  if "robodr-raw" in [tags] {
    ruby {
      # One verification record per Kafka record: the raw value string and
      # each header as a [name, value] pair (one per name: see "Limit" above).
      code => '
        headers = event.get("[@metadata][kafka][headers]") || {}
        pairs = headers.map { |k, v| [k.to_s, v.to_s] }
        event.set("[robodr_verify_input]", { "value" => event.get("message"), "headers" => pairs })
      '
    }
  }
}

output {
  if "robodr-raw" in [tags] {
    file {
      path => "/var/spool/robodr-verify/in-%{+YYYY-MM-dd}.ndjson"
      codec => line { format => "%{[robodr_verify_input]}" }
    }
  }
}

