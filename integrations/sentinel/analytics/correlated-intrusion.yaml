id: fe6b8de9-21fa-5a82-9636-d0f3eda7daf3
name: RoboDR - Correlated intrusion
description: |
  Several independent RoboDR sensors agree on one intrusion (robot.correlate.* findings cite every contributing detection). Observe-only: alerts, never responds.
  RoboDR rule ids (docs/customer/detection-rules.md):
    - robot.correlate.*
severity: High
requiredDataConnectors: []
queryFrequency: 5m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  RoboDRFindings
  | where RuleId startswith "robot.correlate."
  | summarize Count = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated),
      RuleIds = make_set(RuleId), SourceIps = make_set(SourceIp), Verification = make_set(VerificationStatus)
      by RobotId, Site
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: RobotId
version: 1.0.0
kind: Scheduled
