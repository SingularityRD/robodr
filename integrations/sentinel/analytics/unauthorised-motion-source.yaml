id: 8acc7450-2203-5750-a19b-55b1976635c9
name: RoboDR - Unauthorised motion source
description: |
  Something that is not the robot's operator is commanding it: an unauthorised motion writer, a firewall rejection of an unknown source, an unlisted Unitree legacy-UDP sender or an unknown WebRTC controller. Observe-only: alerts, never responds.
  RoboDR rule ids (docs/customer/detection-catalog.md):
    - robot.ros2.unauthorized_motion_writer
    - robot.firewall.rejected_unknown_source
    - robot.unitree.legacy_unknown_sender
    - robot.unitree.webrtc_unknown_controller
severity: High
requiredDataConnectors: []
queryFrequency: 5m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics: []
relevantTechniques: []
query: |
  RoboDRFindings
  | where RuleId in ("robot.ros2.unauthorized_motion_writer", "robot.firewall.rejected_unknown_source", "robot.unitree.legacy_unknown_sender", "robot.unitree.webrtc_unknown_controller")
  | summarize Count = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated),
      RuleIds = make_set(RuleId), SourceIps = make_set(SourceIp), Verification = make_set(VerificationStatus)
      by RobotId, Site
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: RobotId
version: 1.0.0
kind: Scheduled
