# One finding per event: the Kafka record value / one NDJSON line, as JSON.
# Ingest through Splunk Connect for Kafka or HEC with sourcetype robodr:finding.
# If a verifying forwarder (integrations/verify/robodr_verify.py) sits in
# front, the event carries robodr_verification.status.
[robodr:finding]
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
# MAX_FINDING_BYTES of the contract is 64 KiB.
TRUNCATE = 65536
TIME_PREFIX = "timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3QZ
MAX_TIMESTAMP_LOOKAHEAD = 30
TZ = UTC
CHARSET = UTF-8

# CIM Intrusion Detection (IDS_Attacks). Never alias attacker-controlled
# `value` fields: only the escaped `display` forms (SR-TAINT, contract §3).
FIELDALIAS-robodr_cim_signature = entity_context.rule_id AS signature_id title AS signature
FIELDALIAS-robodr_cim_dest = entity_context.robot.id AS dest entity_context.robot.site AS dest_location
FIELDALIAS-robodr_cim_src = entity_context.ros.src_ip.display AS src_ip entity_context.ros.src_ip.display AS src
FIELDALIAS-robodr_id = finding_id AS id ocsf.metadata.uid AS robodr_event_uid external_id AS robodr_external_id
FIELDALIAS-robodr_mitre = mitre_predictions{}.technique_id AS mitre_technique_id
FIELDALIAS-robodr_category = ocsf.finding_info.data_sources{} AS category
FIELDALIAS-robodr_context = entity_context.mode AS robodr_mode entity_context.safety_state.motion AS robodr_motion entity_context.ros.topic.display AS robodr_topic entity_context.ros.participant_guid.display AS robodr_participant evidence_links{} AS robodr_evidence
EVAL-vendor_product = "RoboDR"
EVAL-ids_type = if(match('ocsf.finding_info.data_sources{}', "host_runtime"), "host", "network")
EVAL-action = "allowed"
EVAL-robodr_rule_family = mvindex(split('entity_context.rule_id', "."), 1)
