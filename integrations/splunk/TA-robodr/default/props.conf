FIELDALIAS-robodr_context = entity_context.mode AS robodr_mode entity_context.safety_state.motion AS robodr_motion entity_context.ros.topic.display AS robodr_topic entity_context.ros.participant_guid.display AS robodr_participant evidence_links{} AS robodr_evidence
EVAL-vendor_product = "RoboDR"
