# Observe-only alert searches. They alert; they never respond: a SOC never
# sends a motion command to a robot (docs/contracts/robodr.control-plane.md).
# Keyed on rule ids from docs/customer/detection-catalog.md, never on titles.
# Shipped disabled (enableSched = 0): enable each and add your alert action.

[RoboDR - Unauthorised motion source]
description = Something that is not the robot's operator is commanding it.
search = eventtype=robodr_finding entity_context.rule_id IN ("robot.ros2.unauthorized_motion_writer", "robot.firewall.rejected_unknown_source", "robot.unitree.legacy_unknown_sender", "robot.unitree.webrtc_unknown_controller") (NOT robodr_verification_status=* OR robodr_verification_status="verified") | stats count min(_time) as first_seen max(_time) as last_seen values(entity_context.rule_id) as rule_ids values(entity_context.ros.src_ip.display) as src_ip values(robodr_verification_status) as verification by entity_context.robot.id entity_context.robot.site
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 0
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5

[RoboDR - Motion outside the envelope]
description = Commanded motion beyond the robot's locked profile.
search = eventtype=robodr_finding entity_context.rule_id IN ("robot.motion.linear_over_envelope", "robot.motion.angular_over_envelope", "robot.motion.joint_over_envelope", "robot.firewall.joint_torque_out_of_envelope") (NOT robodr_verification_status=* OR robodr_verification_status="verified") | stats count max(entity_context.command.linear_speed) as max_linear values(entity_context.mode) as mode values(entity_context.safety_state.motion) as motion by entity_context.robot.id entity_context.rule_id
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 0
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4

[RoboDR - Correlated intrusion]
description = Several independent RoboDR sensors agree on one intrusion.
search = eventtype=robodr_finding entity_context.rule_id="robot.correlate.*" (NOT robodr_verification_status=* OR robodr_verification_status="verified") | stats count values(title) as detections values(evidence_links{}) as evidence by entity_context.robot.id entity_context.rule_id
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 0
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5

[RoboDR - Sensor blind or tampered]
description = The robot's sensor cannot see. Treat its silence as unknown, not safe.
search = eventtype=robodr_finding entity_context.rule_id IN ("robot.agent.input_silent", "robot.agent.input_ended", "robot.agent.queue_overflow", "robot.agent.evidence_truncated", "robot.rtps.discovery_not_inspected") (NOT robodr_verification_status=* OR robodr_verification_status="verified") | stats count latest(entity_context.rule_id) as latest_rule by entity_context.robot.id
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 0
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4

[RoboDR - Unknown participant burst]
description = Reconnaissance or a rogue node on the robot network.
search = eventtype=robodr_finding entity_context.rule_id IN ("robot.ros2.unknown_participant", "robot.ros2.discovery_flood") (NOT robodr_verification_status=* OR robodr_verification_status="verified") | stats count dc(entity_context.ros.participant_guid.display) as participants values(entity_context.ros.src_ip.display) as src_ip by entity_context.robot.id | where count >= 3 OR participants >= 3
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 0
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3

[RoboDR - Unverified findings]
description = Findings without a verified signature (no verifying forwarder, unsigned, or rejected upstream). Never automate on these.
search = eventtype=robodr_unverified | fillnull value="none" robodr_verification_status | stats count by entity_context.robot.id robodr_verification_status
dispatch.earliest_time = -60m
dispatch.latest_time = now
cron_schedule = 7 * * * *
enableSched = 0
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
