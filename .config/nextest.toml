# cargo-nextest settings (the `coverage` job of
# .github/workflows/ci-extended.yml runs `cargo llvm-cov nextest --profile
# ci`). Plain `cargo test` ignores this file.

[profile.ci]
# Report every failure, not just the first.
fail-fast = false
# A test that hangs is a failure, not a stuck job (the slowest suites, the
# fuzz smoke runs and the deliverd / depot exit criteria, take well under a
# minute each).
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
# Written to <target dir>/nextest/ci/junit.xml (under cargo-llvm-cov:
# target/llvm-cov-target/nextest/ci/junit.xml; the job copies it to
# target/junit.xml).
path = "junit.xml"
