[package]
name = "robodr-ros2-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not published (crates.io disallows path deps); also lets cargo-deny
# accept version-less path dependencies (deny.toml, allow-wildcard-paths).
publish = false
repository.workspace = true
description = "Pulsar-independent ROS 2 / DDS detection pipeline for RoboDR: datagram sources (multicast socket, passive capture, pcap replay), RTPS parsing, profile deviations, motion user-DATA decoding, bounded dedup, sanitised findings."

# Pure crate: std + RoboDR crates + serde only, so it builds and tests offline.
# The Pulsar glue lives in robodr-sensor-ros2.

[dependencies]
robodr-buildinfo = { workspace = true }
robodr-events = { workspace = true }
robodr-rtps = { workspace = true }
robodr-capture = { workspace = true }
robodr-cdr = { workspace = true }
# The profile file format (strict keys + lock seal) is owned by the
# commissioning crate that writes it; the sensor refuses an edited locked
# profile with the same check (`parse_profile_text`).
robodr-commission = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Ed25519 keys to sign test profiles (profile_trust tests).
robodr-blackbox = { workspace = true }

[[bin]]
name = "robodr-ros2-watch"
path = "src/bin/robodr-ros2-watch.rs"
