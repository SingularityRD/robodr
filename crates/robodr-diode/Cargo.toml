[package]
name = "robodr-diode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "One-way (data diode / controlled media) export of RoboDR findings and black-box bundles from an air-gapped unit to the SOC."

[dependencies]
robodr-blackbox = { workspace = true }
robodr-ocsf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
robodr-events = { workspace = true }

[[bin]]
name = "robodr-diode-pack"
path = "src/bin/robodr-diode-pack.rs"

[[bin]]
name = "robodr-diode-unpack"
path = "src/bin/robodr-diode-unpack.rs"
