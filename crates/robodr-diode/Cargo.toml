[package]
name = "robodr-diode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not published (crates.io disallows path deps); also lets cargo-deny
# accept version-less path dependencies (deny.toml, allow-wildcard-paths).
publish = false
repository.workspace = true
description = "One-way (data diode / controlled media) export of RoboDR findings and black-box bundles from an air-gapped unit to the SOC."

[dependencies]
robodr-buildinfo = { workspace = true }
robodr-blackbox = { workspace = true }
robodr-ocsf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
robodr-events = { workspace = true }
# TEST ORACLE ONLY (tests/fec_oracle.rs): an independent BCH-view
# Reed-Solomon codec over GF(2^8)/0x11D, the same code as src/fec.rs, used to
# pin our parity bytes. Never a runtime dependency: it is unmaintained since
# 2018 and not audited. See src/fec.rs, "Why in-crate".
reed-solomon = "0.2.1"

[[bin]]
name = "robodr-diode-pack"
path = "src/bin/robodr-diode-pack.rs"

[[bin]]
name = "robodr-diode-unpack"
path = "src/bin/robodr-diode-unpack.rs"
