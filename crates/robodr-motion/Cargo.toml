[package]
name = "robodr-motion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not published (crates.io disallows path deps); also lets cargo-deny
# accept version-less path dependencies (deny.toml, allow-wildcard-paths).
publish = false
repository.workspace = true
description = "Motion/feedback consistency detection (pure): catches injected telemetry by correlating commands with sensor-authored feedback."

[dependencies]
robodr-events = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
