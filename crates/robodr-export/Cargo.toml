[package]
name = "robodr-export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not published (crates.io disallows path deps); also lets cargo-deny
# accept version-less path dependencies (deny.toml, allow-wildcard-paths).
publish = false
repository.workspace = true
description = "Exporters for robodr.findings: agentd spool -> diode packer (robot side); diode importer output / site spool -> Kafka (std-only Kafka producer) or -> the AutoSecOps ingest API over TLS (robodr-uplink)."

# Pure Rust crates + RoboDR crates + serde; the Kafka client is a minimal
# in-crate implementation (README). rustls (+ ring) is the TLS stack of
# robodr-uplink (ingest API client) and of the Kafka producer (through
# robodr_blackbox::tls). SASL/SCRAM uses RustCrypto's hmac / sha2 / pbkdf2
# (with `zeroize`) and base64ct; zeroize wipes its derived keys.
[dependencies]
robodr-buildinfo = { workspace = true }
robodr-agentd = { workspace = true }
robodr-blackbox = { workspace = true }
robodr-diode = { workspace = true }
robodr-ocsf = { workspace = true }
rustls = { workspace = true }
webpki = { workspace = true }
zeroize = { workspace = true }
hmac13 = { workspace = true }
sha2-11 = { workspace = true }
pbkdf2 = { workspace = true }
base64ct = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The fake broker's side of SCRAM (tests/common).
sha2 = { workspace = true }
robodr-agent = { workspace = true }
robodr-events = { workspace = true }
# The crate's own tests reproduce a split pack (Exporter::open refuses the
# mismatched limits that cause one) through the test-only feature below.
robodr-export = { path = ".", features = ["fault-injection"] }

[features]
# Test-only hooks; never enable in a deployed build.
fault-injection = []

[[bin]]
name = "robodr-spool-export"
path = "src/bin/robodr-spool-export.rs"

[[bin]]
name = "robodr-kafka-publish"
path = "src/bin/robodr-kafka-publish.rs"

[[bin]]
name = "robodr-uplink"
path = "src/bin/robodr-uplink.rs"
