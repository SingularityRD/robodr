[package]
name = "robodr-export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not published (crates.io disallows path deps); also lets cargo-deny
# accept version-less path dependencies (deny.toml, allow-wildcard-paths).
publish = false
repository.workspace = true
description = "Exporters for robodr.findings: agentd spool -> diode packer (robot side), and diode importer output / site spool -> Kafka (SOC side, std-only Kafka producer)."

# Pure crate: std + RoboDR crates + serde only. The Kafka client is a minimal
# in-crate implementation (no TLS/SASL; see README).
[dependencies]
robodr-agentd = { workspace = true }
robodr-blackbox = { workspace = true }
robodr-diode = { workspace = true }
robodr-ocsf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
robodr-agent = { workspace = true }
robodr-events = { workspace = true }
# The crate's own tests reproduce a split pack (Exporter::open refuses the
# mismatched limits that cause one) through the test-only feature below.
robodr-export = { path = ".", features = ["fault-injection"] }

[features]
# Test-only hooks; never enable in a deployed build.
fault-injection = []

[[bin]]
name = "robodr-spool-export"
path = "src/bin/robodr-spool-export.rs"

[[bin]]
name = "robodr-kafka-publish"
path = "src/bin/robodr-kafka-publish.rs"
