[package]
name = "robodr-firewall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not published (crates.io disallows path deps); also lets cargo-deny
# accept version-less path dependencies (deny.toml, allow-wildcard-paths).
publish = false
repository.workspace = true
description = "Motion Firewall core (pure, deterministic, allocation-free hot path): pass / limit / reject each motion command against the locked envelope."

[dependencies]
robodr-events = { workspace = true }
