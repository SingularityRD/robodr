[package]
name = "robodr-blackbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not published (crates.io disallows path deps); also lets cargo-deny
# accept version-less path dependencies (deny.toml, allow-wildcard-paths).
publish = false
repository.workspace = true
description = "Signed, hash-chained black-box evidence recorder for RoboDR."

[dependencies]
robodr-events = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "robodr-blackbox"
path = "src/bin/robodr-blackbox.rs"
# Same crate name as the library: keep it out of rustdoc to avoid a collision.
doc = false
