[package]
name = "robodr-sensor-ros2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "RoboDR ROS 2 / DDS graph sensor, as a Pulsar module."

# PULSAR-DEPENDENT CRATE: needs pulsar-core + tokio (crates.io), so it is
# skipped by the offline build. It is only Pulsar/tokio glue; all detection
# logic, the config, the SPDP socket and the capture adapter live in the pure
# crate robodr-ros2-pipeline (built and tested offline).
# See docs/PULSAR-INTEGRATION.md.

[dependencies]
robodr-ros2-pipeline = { workspace = true }
pulsar-core = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
