[package]
name = "robodr-rtps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not published (crates.io disallows path deps); also lets cargo-deny
# accept version-less path dependencies (deny.toml, allow-wildcard-paths).
publish = false
repository.workspace = true
description = "Read-only RTPS discovery (SPDP/SEDP) parser for RoboDR. Pure, no I/O, no Pulsar."

[dependencies]
robodr-events = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
