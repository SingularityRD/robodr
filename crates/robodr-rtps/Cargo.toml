[package]
name = "robodr-rtps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not published (crates.io disallows path deps); also lets cargo-deny
# accept version-less path dependencies (deny.toml, allow-wildcard-paths).
publish = false
repository.workspace = true
description = "Read-only RTPS discovery (SPDP/SEDP) parser for RoboDR. Pure, no I/O, no Pulsar."

[dependencies]
robodr-events = { workspace = true }
# SHA-256 of a claimed certificate subject (DDS-Security GUID prefix check,
# `secured_prefix`); already in the workspace lock.
sha2 = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
