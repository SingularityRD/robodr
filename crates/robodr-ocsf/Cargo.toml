[package]
name = "robodr-ocsf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not published (crates.io disallows path deps); also lets cargo-deny
# accept version-less path dependencies (deny.toml, allow-wildcard-paths).
publish = false
repository.workspace = true
description = "Maps RoboDR deviations to OCSF findings for the AutoSecOps robot-edr.findings contract."

[dependencies]
robodr-blackbox = { workspace = true }
robodr-events = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
