[package]
name = "robodr-ocsf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not published (crates.io disallows path deps); also lets cargo-deny
# accept version-less path dependencies (deny.toml, allow-wildcard-paths).
publish = false
repository.workspace = true
description = "Maps RoboDR deviations to OCSF Detection Findings in the vendor-neutral robodr.findings contract."

[dependencies]
robodr-blackbox = { workspace = true }
robodr-events = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# Test-only: forges a small-order-R signature under a real key
# (tests/integrations_content.rs). Already in the graph via ed25519-dalek.
curve25519-dalek = { workspace = true }
