[package]
name = "robodr-agentd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not published (crates.io disallows path deps); also lets cargo-deny
# accept version-less path dependencies (deny.toml, allow-wildcard-paths).
publish = false
repository.workspace = true
description = "RoboDR live daemon: capture / pcap / JSONL events -> ROS 2 pipeline -> decision chain (robodr-agent) -> signed black box -> OCSF findings spool, with self-health. Std threads only (no async runtime); plans, never executes."

# Pure crate: std + RoboDR crates + serde only (no async runtime, no Pulsar), so it
# builds and is tested offline.
[dependencies]
robodr-agent = { workspace = true }
robodr-blackbox = { workspace = true }
# std_msgs / Odometry decoders of the live safety-state feed.
robodr-cdr = { workspace = true }
# Passive SEDP + user-DATA walk for safety-state topics (`safety`).
robodr-rtps = { workspace = true }
# Profile trust (signature, version label); already a dependency of the
# pipeline.
robodr-commission = { workspace = true }
# Weak-signal correlation over every finding the daemon reports.
robodr-correlate = { workspace = true }
robodr-events = { workspace = true }
# executor v1: orders to the separate robodr-executor process (client side
# of its protocol, order types); agentd itself never touches nftables.
robodr-executor = { workspace = true }
robodr-firewall = { workspace = true }
robodr-motion = { workspace = true }
robodr-ocsf = { workspace = true }
robodr-responder = { workspace = true }
robodr-ros2-pipeline = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
robodr-capture = { workspace = true }

[[bin]]
name = "robodr-agentd"
path = "src/bin/robodr-agentd.rs"
