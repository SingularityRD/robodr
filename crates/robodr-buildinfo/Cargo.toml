[package]
name = "robodr-buildinfo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not published (crates.io disallows path deps); also lets cargo-deny
# accept version-less path dependencies (deny.toml, allow-wildcard-paths).
publish = false
repository.workspace = true
description = "Build identity (commit, SOURCE_DATE_EPOCH, target triple) for the --version line of every RoboDR binary."
build = "build.rs"

# No dependencies: a build script reads three environment variables.
