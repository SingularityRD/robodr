[package]
name = "robodr-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "RoboDR decision chain (offline): event -> deviation -> response plan -> black-box evidence -> OCSF finding. Plans only; executes nothing."

[dependencies]
