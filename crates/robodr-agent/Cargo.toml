[package]
name = "robodr-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not published (crates.io disallows path deps); also lets cargo-deny
# accept version-less path dependencies (deny.toml, allow-wildcard-paths).
publish = false
repository.workspace = true
description = "RoboDR decision chain (offline): event -> deviation -> response plan -> black-box evidence -> OCSF finding. Plans only; executes nothing."

[dependencies]
robodr-buildinfo = { workspace = true }
robodr-events = { workspace = true }
robodr-responder = { workspace = true }
robodr-blackbox = { workspace = true }
zeroize = { workspace = true }
robodr-ocsf = { workspace = true }
robodr-motion = { workspace = true }
robodr-firewall = { workspace = true }
robodr-commission = { workspace = true }
robodr-cdr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "robodr-replay"
path = "src/bin/robodr-replay.rs"
