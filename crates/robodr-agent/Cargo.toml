robodr-motion = { workspace = true }
robodr-firewall = { workspace = true }
robodr-commission = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "robodr-replay"
path = "src/bin/robodr-replay.rs"
