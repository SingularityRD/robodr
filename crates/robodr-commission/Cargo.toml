[package]
name = "robodr-commission"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not published (crates.io disallows path deps); also lets cargo-deny
# accept version-less path dependencies (deny.toml, allow-wildcard-paths).
publish = false
repository.workspace = true
description = "Observe-mode commissioning: learns a robot's model profile from clean-run events and emits profile.json for the OEM to lock."

[dependencies]
robodr-buildinfo = { workspace = true }
robodr-events = { workspace = true }
robodr-capture = { workspace = true }
robodr-rtps = { workspace = true }
# Motion command samples in `learn --pcap` (same decoder as the sensor).
robodr-cdr = { workspace = true }
# std-only SHA-256 (profile seal, sign-off binding).
robodr-blackbox = { workspace = true }
# `bind` checks a Motion Firewall file compiles against the draft and
# `firewall-draft` writes one; `bind` parses the response policy it binds.
# Both are pure RoboDR crates (events + serde), no new third-party code.
robodr-firewall = { workspace = true }
robodr-responder = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "robodr-commission"
path = "src/main.rs"
