# RoboDR robot detection rules, in Pulsar's rules-engine format.
#
# These run in the Pulsar rules engine over the shared event bus, ALONGSIDE the
# robodr-sensor-ros2 module (which does its own profile check and raises its own
# threats). The rules here cover host-level robot threats that the standard
# process/file/network probes already observe — no robot-specific sensor needed.
#
# Topic/motion rules that need DDS graph context live in the sensor module, not
# here, because the rules engine sees the host events, not the RTPS graph.

[[rules]]
name = "Robot controller spawns a shell"
type = "Exec"
category = "robotics"
# A motion controller process should never exec an interactive shell. Tune the
# parent image list to the robot's real control stack during commissioning.
condition = 'payload.filename IN ["/bin/sh", "/bin/bash", "/bin/dash"] AND header.image STARTS_WITH "/opt/ros"'

[[rules]]
name = "Write to ROS 2 launch or params directory"
type = "FileCreated"
category = "robotics"
condition = 'payload.filename STARTS_WITH "/opt/ros" OR payload.filename STARTS_WITH "/etc/robodr"'

[[rules]]
name = "Outbound connection from robot controller to non-local network"
type = "Connect"
category = "robotics"
# The controller talks to the fleet gateway and the local cell only. Replace the
# local prefixes with the robot's real management subnet.
condition = 'header.image STARTS_WITH "/opt/ros" AND NOT (payload.destination.ip STARTS_WITH "10." OR payload.destination.ip STARTS_WITH "192.168.")'

[[rules]]
name = "Reverse shell pattern on the controller"
type = "Exec"
category = "robotics"
condition = 'payload.argv CONTAINS "-i" AND (payload.filename == "/bin/sh" OR payload.filename == "/bin/bash")'
