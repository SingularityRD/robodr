(
  payload.filename == "/etc/robodr" OR payload.filename STARTS_WITH "/etc/robodr/"
  OR payload.filename == "/etc/pulsar" OR payload.filename STARTS_WITH "/etc/pulsar/"
  OR payload.filename == "/usr/share/robodr" OR payload.filename STARTS_WITH "/usr/share/robodr/"
