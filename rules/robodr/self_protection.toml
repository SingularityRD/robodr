  OR payload.filename STARTS_WITH "/sbin/robodr-pulsard" OR payload.filename STARTS_WITH "/sbin/robodr-agentd"
  OR (payload.filename STARTS_WITH "/usr/lib/systemd/" AND payload.filename CONTAINS "/robodr-")
  OR (payload.filename STARTS_WITH "/lib/systemd/" AND payload.filename CONTAINS "/robodr-")
  OR (payload.filename STARTS_WITH "/etc/systemd/" AND payload.filename CONTAINS "/robodr-")
  OR (payload.filename STARTS_WITH "/run/systemd/system/" AND payload.filename CONTAINS "/robodr-")
  OR (payload.filename STARTS_WITH "/run/systemd/system.control/" AND payload.filename CONTAINS "/robodr-")
  OR payload.filename STARTS_WITH "/run/systemd/transient/robodr-"
  OR payload.filename STARTS_WITH "/etc/systemd/system/service.d" OR payload.filename STARTS_WITH "/run/systemd/system/service.d"
