# RoboDR host rules: tampering with RoboDR and Pulsar on the robot.
#
# Protected paths (the real installed layout, packaging/build-deb.sh):
#   /etc/robodr/          model profile, trust keys, pulsar.toml (rules_path), agentd.json, keys/
#   /etc/pulsar/          legacy / upstream Pulsar config and rules location
#   /usr/share/robodr/    rules_path = /usr/share/robodr/rules (RoboDR + upstream Pulsar rules)
#   /usr/sbin/robodr-pulsard, /usr/sbin/robodr-agentd (and /sbin/ spellings, plus
#                         siblings such as robodr-agentd.dpkg-new / .bak)
#   robodr-* systemd units: /usr/lib/systemd/system (where the package installs
#                         them), /lib/systemd/system, /etc/systemd/** (overrides,
#                         robodr-*.service.d drop-ins, *.wants enablement links,
#                         'systemctl mask' links, system.control set-property
#                         drop-ins), /run/systemd/system{,.control} (--runtime
#                         variants), /run/systemd/transient
#   top-level service.d/ drop-in directories (they apply to EVERY service,
#                         robodr-* included)
# Editing any of these blinds detection: a widened profile accepts the
# attacker's participant, a deleted or emptied rule file stops alerts after
# the next restart (rules load once at start-up), a drop-in can replace
# ExecStart or add ExecStartPre=/bin/false, a mask link stops the daemon from
# ever starting again, and a replaced daemon binary hands the sensor itself to
# the attacker.
#
# Every way a file system object can appear, change or go away there is
# watched: write-open, create (incl. mknod FIFOs/devices), delete, rename
# (file AND directory, source or destination, including the directories
# themselves: 'mv /etc/robodr /etc/robodr.old'), link, mkdir (a new drop-in
# directory) and rmdir.
#
# Exclusion: dpkg by EXACT image path (/usr/bin/dpkg, /bin/dpkg), as in every
# other RoboDR write rule. The signed offline bundle (install-bundle.sh) is
# installed with dpkg, so the package's own writes (*.dpkg-new + rename) do
# not alert; the install itself is recorded by supply_chain.toml. Everything
# else that writes here (operator edits, 'systemctl edit', 'systemctl
# enable/mask/set-property' (performed by PID 1), systemd-tmpfiles creating a
# missing /etc/robodr/keys on first install, robodr-commission rotating keys)
# fires and is the audit trail.
# TUNE: when a signed update agent other than dpkg exists, exclude it by exact
# header.image here (and only it).

[[rules]]
name = "RoboDR: RoboDR or Pulsar protected file written"
type = "FileOpened"
category = "defense_evasion"
severity = "high"
description = "A protected RoboDR/Pulsar file was opened for writing by something other than dpkg (exact image). Protected: /etc/robodr, /etc/pulsar, /usr/share/robodr (rules_path), /usr/sbin/robodr-pulsard and /usr/sbin/robodr-agentd, the robodr-* systemd units with their drop-ins, enablement and mask links under /usr/lib/systemd, /lib/systemd, /etc/systemd and /run/systemd, and the top-level service.d drop-in directories (see the file header). These are provisioned at commissioning and changed only by the signed update path."
condition = '''
(
  payload.filename == "/etc/robodr" OR payload.filename STARTS_WITH "/etc/robodr/"
  OR payload.filename == "/etc/pulsar" OR payload.filename STARTS_WITH "/etc/pulsar/"
  OR payload.filename == "/usr/share/robodr" OR payload.filename STARTS_WITH "/usr/share/robodr/"
  OR payload.filename STARTS_WITH "/usr/sbin/robodr-pulsard" OR payload.filename STARTS_WITH "/usr/sbin/robodr-agentd"
  OR payload.filename STARTS_WITH "/sbin/robodr-pulsard" OR payload.filename STARTS_WITH "/sbin/robodr-agentd"
  OR (payload.filename STARTS_WITH "/usr/lib/systemd/" AND payload.filename CONTAINS "/robodr-")
  OR (payload.filename STARTS_WITH "/lib/systemd/" AND payload.filename CONTAINS "/robodr-")
  OR (payload.filename STARTS_WITH "/etc/systemd/" AND payload.filename CONTAINS "/robodr-")
  OR (payload.filename STARTS_WITH "/run/systemd/system/" AND payload.filename CONTAINS "/robodr-")
  OR (payload.filename STARTS_WITH "/run/systemd/system.control/" AND payload.filename CONTAINS "/robodr-")
  OR payload.filename STARTS_WITH "/run/systemd/transient/robodr-"
  OR payload.filename STARTS_WITH "/etc/systemd/system/service.d" OR payload.filename STARTS_WITH "/run/systemd/system/service.d"
  OR payload.filename STARTS_WITH "/usr/lib/systemd/system/service.d" OR payload.filename STARTS_WITH "/lib/systemd/system/service.d"
)
AND (payload.flags CONTAINS "O_WRONLY" OR payload.flags CONTAINS "O_RDWR")
AND NOT (header.image == "/usr/bin/dpkg" OR header.image == "/bin/dpkg")
'''

[[rules]]
name = "RoboDR: RoboDR or Pulsar protected file deleted"
type = "FileDeleted"
category = "defense_evasion"
severity = "high"
description = "A protected RoboDR/Pulsar file was deleted by something other than dpkg (e.g. a rule file, to stop alerts after the next restart; a drop-in or unit file; the daemon binary). Protected: /etc/robodr, /etc/pulsar, /usr/share/robodr (rules_path), /usr/sbin/robodr-pulsard and /usr/sbin/robodr-agentd, the robodr-* systemd units with their drop-ins, enablement and mask links under /usr/lib/systemd, /lib/systemd, /etc/systemd and /run/systemd, and the top-level service.d drop-in directories (see the file header)."
condition = '''
(
  payload.filename == "/etc/robodr" OR payload.filename STARTS_WITH "/etc/robodr/"
  OR payload.filename == "/etc/pulsar" OR payload.filename STARTS_WITH "/etc/pulsar/"
  OR payload.filename == "/usr/share/robodr" OR payload.filename STARTS_WITH "/usr/share/robodr/"
  OR payload.filename STARTS_WITH "/usr/sbin/robodr-pulsard" OR payload.filename STARTS_WITH "/usr/sbin/robodr-agentd"
  OR payload.filename STARTS_WITH "/sbin/robodr-pulsard" OR payload.filename STARTS_WITH "/sbin/robodr-agentd"
  OR (payload.filename STARTS_WITH "/usr/lib/systemd/" AND payload.filename CONTAINS "/robodr-")
  OR (payload.filename STARTS_WITH "/lib/systemd/" AND payload.filename CONTAINS "/robodr-")
  OR (payload.filename STARTS_WITH "/etc/systemd/" AND payload.filename CONTAINS "/robodr-")
  OR (payload.filename STARTS_WITH "/run/systemd/system/" AND payload.filename CONTAINS "/robodr-")
  OR (payload.filename STARTS_WITH "/run/systemd/system.control/" AND payload.filename CONTAINS "/robodr-")
  OR payload.filename STARTS_WITH "/run/systemd/transient/robodr-"
  OR payload.filename STARTS_WITH "/etc/systemd/system/service.d" OR payload.filename STARTS_WITH "/run/systemd/system/service.d"
  OR payload.filename STARTS_WITH "/usr/lib/systemd/system/service.d" OR payload.filename STARTS_WITH "/lib/systemd/system/service.d"
)
AND NOT (header.image == "/usr/bin/dpkg" OR header.image == "/bin/dpkg")
'''

