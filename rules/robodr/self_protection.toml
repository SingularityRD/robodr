# RoboDR host rules: tampering with RoboDR and Pulsar on the robot.
#
# /etc/robodr holds the locked model profile (profile.json) that the ROS 2
# graph sensor and the motion envelope check against; /etc/pulsar holds the
# daemon config and these rules. Editing either blinds detection: a widened
# profile accepts the attacker's participant, a deleted rule file stops alerts
# after the next daemon restart (rules are loaded once at start-up).
#
# Every way a file can appear or change under these directories is watched:
# write-open, create (incl. mknod FIFOs/devices), delete, rename and link.
#
# TUNE: when the signed update agent is installed, exclude it by header.image
# in the file rules (and only it). Service names in the last rule
# depend on how RoboDR packages the daemon (Pulsar ships no systemd unit).

[[rules]]
name = "RoboDR: RoboDR profile or Pulsar configuration written"
type = "FileOpened"
category = "defense_evasion"
severity = "high"
description = "A file under /etc/robodr (model profile, envelope) or /etc/pulsar (daemon config, rules) was opened for writing. These are provisioned at commissioning and changed only by the signed update path."
condition = '''
(payload.filename STARTS_WITH "/etc/robodr/" OR payload.filename STARTS_WITH "/etc/pulsar/")
AND (payload.flags CONTAINS "O_WRONLY" OR payload.flags CONTAINS "O_RDWR")
'''

[[rules]]
name = "RoboDR: RoboDR profile or Pulsar configuration deleted"
type = "FileDeleted"
category = "defense_evasion"
severity = "high"
description = "A file under /etc/robodr or /etc/pulsar was deleted (e.g. a rule file, to stop alerts after the next restart)."
condition = 'payload.filename STARTS_WITH "/etc/robodr/" OR payload.filename STARTS_WITH "/etc/pulsar/"'

[[rules]]
name = "RoboDR: RoboDR profile or Pulsar configuration renamed"
type = "FileRename"
category = "defense_evasion"
severity = "high"
description = "A file was renamed into or out of /etc/robodr or /etc/pulsar (atomic replacement of the profile, or moving a rule file away)."
condition = '''
payload.source STARTS_WITH "/etc/robodr/" OR payload.source STARTS_WITH "/etc/pulsar/"
OR payload.destination STARTS_WITH "/etc/robodr/" OR payload.destination STARTS_WITH "/etc/pulsar/"
'''

[[rules]]
name = "RoboDR: File or device node created in the RoboDR or Pulsar configuration"
type = "FileCreated"
category = "defense_evasion"
severity = "high"
description = "A new file system object was created under /etc/robodr or /etc/pulsar. Pulsar reports both open(O_CREAT) and mknod(2) as FileCreated, so this catches a FIFO or device node dropped into the rules directory (mkfifo /etc/pulsar/rules/zz.toml: the rules engine blocks reading it at the next start), as well as new rule files that disable or shadow detection after a restart. Only the signed update path adds files here."
condition = 'payload.filename STARTS_WITH "/etc/robodr/" OR payload.filename STARTS_WITH "/etc/pulsar/"'

[[rules]]
name = "RoboDR: Link created in or to the RoboDR or Pulsar configuration"
type = "FileLink"
category = "defense_evasion"
severity = "high"
description = "A hard or symbolic link was created under /etc/robodr or /etc/pulsar (e.g. /etc/pulsar/rules/zz.toml -> /dev/null or -> a huge file, which makes the rules engine fail or hang at start, or a planted rule file linked in from elsewhere), or a hard link to a file in those directories was created elsewhere (an alias through which the file can later be rewritten without a write-open under /etc/pulsar, because Pulsar reports the path the file was opened by). Pulsar FileLink: 'source' is the new link, 'destination' the target; for symlinks the target is the raw string, so only hard-link targets are matched."
condition = '''
payload.source STARTS_WITH "/etc/robodr/" OR payload.source STARTS_WITH "/etc/pulsar/"
OR (payload.hard_link == "true" AND (payload.destination STARTS_WITH "/etc/robodr/" OR payload.destination STARTS_WITH "/etc/pulsar/"))
'''

[[rules]]
name = "RoboDR: Attempt to stop the Pulsar or RoboDR service"
type = "Exec"
category = "defense_evasion"
severity = "high"
description = "systemctl stop/disable/mask/kill, or kill-by-name (pkill/killall), was run against the Pulsar daemon or a RoboDR service. Stopping the sensor is the first step before tampering with the robot."
condition = '''
(
  payload.filename ENDS_WITH "/systemctl"
  AND (payload.argv CONTAINS "stop" OR payload.argv CONTAINS "disable" OR payload.argv CONTAINS "mask" OR payload.argv CONTAINS "kill")
  AND (payload.argv CONTAINS "pulsar" OR payload.argv CONTAINS "pulsar.service" OR payload.argv CONTAINS "pulsard"
       OR payload.argv CONTAINS "pulsard.service" OR payload.argv CONTAINS "robodr" OR payload.argv CONTAINS "robodr.service")
)
OR (
  (payload.filename ENDS_WITH "/pkill" OR payload.filename ENDS_WITH "/killall")
  AND (payload.argv CONTAINS "pulsard" OR payload.argv CONTAINS "pulsar")
)
'''
