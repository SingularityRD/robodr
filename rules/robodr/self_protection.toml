condition = '''
(
  payload.dirname == "/etc/robodr" OR payload.dirname STARTS_WITH "/etc/robodr/"
  OR payload.dirname == "/etc/pulsar" OR payload.dirname STARTS_WITH "/etc/pulsar/"
  OR payload.dirname == "/usr/share/robodr" OR payload.dirname STARTS_WITH "/usr/share/robodr/"
  OR payload.dirname STARTS_WITH "/usr/sbin/robodr-pulsard" OR payload.dirname STARTS_WITH "/usr/sbin/robodr-agentd"
  OR payload.dirname STARTS_WITH "/sbin/robodr-pulsard" OR payload.dirname STARTS_WITH "/sbin/robodr-agentd"
  OR (payload.dirname STARTS_WITH "/usr/lib/systemd/" AND payload.dirname CONTAINS "/robodr-")
  OR (payload.dirname STARTS_WITH "/lib/systemd/" AND payload.dirname CONTAINS "/robodr-")
  OR (payload.dirname STARTS_WITH "/etc/systemd/" AND payload.dirname CONTAINS "/robodr-")
  OR (payload.dirname STARTS_WITH "/run/systemd/system/" AND payload.dirname CONTAINS "/robodr-")
