AND NOT (header.image == "/usr/bin/dpkg" OR header.image == "/bin/dpkg")
'''

[[rules]]
name = "RoboDR: Link created in or to a RoboDR or Pulsar protected path"
type = "FileLink"
category = "defense_evasion"
severity = "high"
description = "A hard or symbolic link was created in a protected RoboDR/Pulsar path (a rule file -> /dev/null or a huge file, which makes the rules engine fail or hang at start; 'systemctl mask' / a manual robodr-*.service -> /dev/null link; a *.wants enablement link added or replaced; a daemon path pointed at another binary), or a hard link to a protected file was created elsewhere (an alias through which it can later be rewritten without a write-open under the protected path, because Pulsar reports the path the file was opened by), by something other than dpkg. Pulsar FileLink: 'source' is the new link, 'destination' the target; for symlinks the target is the raw string, so only hard-link targets are matched. Protected: /etc/robodr, /etc/pulsar, /usr/share/robodr (rules_path), /usr/sbin/robodr-pulsard and /usr/sbin/robodr-agentd, the robodr-* systemd units with their drop-ins, enablement and mask links under /usr/lib/systemd, /lib/systemd, /etc/systemd and /run/systemd, and the top-level service.d drop-in directories (see the file header)."
condition = '''
(
(
  payload.source == "/etc/robodr" OR payload.source STARTS_WITH "/etc/robodr/"
  OR payload.source == "/etc/pulsar" OR payload.source STARTS_WITH "/etc/pulsar/"
  OR payload.source == "/usr/share/robodr" OR payload.source STARTS_WITH "/usr/share/robodr/"
  OR payload.source STARTS_WITH "/usr/sbin/robodr-pulsard" OR payload.source STARTS_WITH "/usr/sbin/robodr-agentd"
  OR payload.source STARTS_WITH "/sbin/robodr-pulsard" OR payload.source STARTS_WITH "/sbin/robodr-agentd"
  OR (payload.source STARTS_WITH "/usr/lib/systemd/" AND payload.source CONTAINS "/robodr-")
  OR (payload.source STARTS_WITH "/lib/systemd/" AND payload.source CONTAINS "/robodr-")
  OR (payload.source STARTS_WITH "/etc/systemd/" AND payload.source CONTAINS "/robodr-")
  OR (payload.source STARTS_WITH "/run/systemd/system/" AND payload.source CONTAINS "/robodr-")
  OR (payload.source STARTS_WITH "/run/systemd/system.control/" AND payload.source CONTAINS "/robodr-")
  OR payload.source STARTS_WITH "/run/systemd/transient/robodr-"
  OR payload.source STARTS_WITH "/etc/systemd/system/service.d" OR payload.source STARTS_WITH "/run/systemd/system/service.d"
  OR payload.source STARTS_WITH "/usr/lib/systemd/system/service.d" OR payload.source STARTS_WITH "/lib/systemd/system/service.d"
)
OR (payload.hard_link == "true" AND (
    payload.destination == "/etc/robodr" OR payload.destination STARTS_WITH "/etc/robodr/"
    OR payload.destination == "/etc/pulsar" OR payload.destination STARTS_WITH "/etc/pulsar/"
    OR payload.destination == "/usr/share/robodr" OR payload.destination STARTS_WITH "/usr/share/robodr/"
    OR payload.destination STARTS_WITH "/usr/sbin/robodr-pulsard" OR payload.destination STARTS_WITH "/usr/sbin/robodr-agentd"
    OR payload.destination STARTS_WITH "/sbin/robodr-pulsard" OR payload.destination STARTS_WITH "/sbin/robodr-agentd"
    OR (payload.destination STARTS_WITH "/usr/lib/systemd/" AND payload.destination CONTAINS "/robodr-")
    OR (payload.destination STARTS_WITH "/lib/systemd/" AND payload.destination CONTAINS "/robodr-")
    OR (payload.destination STARTS_WITH "/etc/systemd/" AND payload.destination CONTAINS "/robodr-")
    OR (payload.destination STARTS_WITH "/run/systemd/system/" AND payload.destination CONTAINS "/robodr-")
    OR (payload.destination STARTS_WITH "/run/systemd/system.control/" AND payload.destination CONTAINS "/robodr-")
    OR payload.destination STARTS_WITH "/run/systemd/transient/robodr-"
    OR payload.destination STARTS_WITH "/etc/systemd/system/service.d" OR payload.destination STARTS_WITH "/run/systemd/system/service.d"
    OR payload.destination STARTS_WITH "/usr/lib/systemd/system/service.d" OR payload.destination STARTS_WITH "/lib/systemd/system/service.d"
  ))
)
AND NOT (header.image == "/usr/bin/dpkg" OR header.image == "/bin/dpkg")
'''

[[rules]]
