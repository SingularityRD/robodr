  OR payload.dirname STARTS_WITH "/usr/lib/systemd/system/service.d" OR payload.dirname STARTS_WITH "/lib/systemd/system/service.d"
)
AND NOT (header.image == "/usr/bin/dpkg" OR header.image == "/bin/dpkg")
'''

