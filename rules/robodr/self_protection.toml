[[rules]]
name = "RoboDR: Attempt to stop the Pulsar or RoboDR service"
type = "Exec"
category = "defense_evasion"
severity = "high"
description = "systemctl stop/disable/mask/kill/freeze/set-property/edit, 'service ... stop', or kill-by-name (pkill/killall), was run against the RoboDR daemons (robodr-pulsard.service, robodr-agentd.service, the robodr-pulsard / robodr-agentd binaries) or an upstream Pulsar unit. Stopping, freezing or starving the sensor is the first step before tampering with the robot. The package's own prerm stops both units on removal (not on upgrade): that is the audit trail of a removal. Not seen: kill by PID, unit globs ('robodr-*'), and argv forms not listed (see rules/README.md); the dead sensor then has to be noticed by its missing heartbeat."
condition = '''
(
  payload.filename ENDS_WITH "/systemctl"
  AND (payload.argv CONTAINS "stop" OR payload.argv CONTAINS "disable" OR payload.argv CONTAINS "mask" OR payload.argv CONTAINS "kill"
       OR payload.argv CONTAINS "freeze" OR payload.argv CONTAINS "set-property" OR payload.argv CONTAINS "edit")
  AND (payload.argv CONTAINS "robodr-pulsard.service" OR payload.argv CONTAINS "robodr-pulsard"
       OR payload.argv CONTAINS "robodr-agentd.service" OR payload.argv CONTAINS "robodr-agentd"
       OR payload.argv CONTAINS "pulsar" OR payload.argv CONTAINS "pulsar.service" OR payload.argv CONTAINS "pulsard"
       OR payload.argv CONTAINS "pulsard.service" OR payload.argv CONTAINS "robodr" OR payload.argv CONTAINS "robodr.service")
)
OR (
  payload.filename ENDS_WITH "/service"
  AND payload.argv CONTAINS "stop"
  AND (payload.argv CONTAINS "robodr-pulsard" OR payload.argv CONTAINS "robodr-agentd" OR payload.argv CONTAINS "pulsar"
       OR payload.argv CONTAINS "pulsard" OR payload.argv CONTAINS "robodr")
)
OR (
  (payload.filename ENDS_WITH "/pkill" OR payload.filename ENDS_WITH "/killall")
  AND (payload.argv CONTAINS "robodr-pulsard" OR payload.argv CONTAINS "robodr-agentd" OR payload.argv CONTAINS "robodr"
       OR payload.argv CONTAINS "pulsard" OR payload.argv CONTAINS "pulsar")
)
'''
