# RoboDR host rules: SROS 2 keystore (DDS-Security identities).
#
# Threat: Sakib et al., MILCOM 2025 -- a trojaned Debian package read the SROS 2
# keystore; the attacker rejoined the graph as an AUTHENTICATED participant.
# Captured-unit exploitation (key extraction) is the defence-platform analogue.
#
# SROS 2 keystore layout (ros2 security create_keystore / create_enclave):
#   <keystore>/enclaves/<enclave path>/key.pem         enclave private key
#   <keystore>/enclaves/<enclave path>/*.p7s, *.pem     signed governance/permissions, certs
#   <keystore>/private/{ca,identity_ca,permissions_ca}.key.pem   CA private keys
# Paths are matched by these suffixes, so the rules work for any keystore root
# (ROS_SECURITY_KEYSTORE is an environment variable; Pulsar does not expose env).
#
# TUNE markers: see ros2_stack.toml. If the robot runs rclpy nodes with
# security enabled, those nodes read key.pem as /usr/bin/python3.x; add that
# image to the exclusion only if you accept that any Python process may then
# read the key unflagged.

[[rules]]
name = "RoboDR: SROS 2 enclave private key read by a process outside the ROS stack"
type = "FileOpened"
category = "credential_access"
severity = "high"
description = "An SROS 2 enclave private key (enclaves/**/key.pem) was opened by a process that is not a ROS 2 node from the ROS install tree or robot workspace. Nodes load their key through the DDS security plugin at start-up; any other reader (cat, scp, python, a package maintainer script) is key theft. The allowlist is by image prefix; header.image is the execve path verbatim (not resolved), so a path that climbs out with /../ (e.g. /opt/ros/humble/../../../tmp/x) is not trusted, and links planted inside the install tree are flagged by the ros2_stack.toml link rule. A stolen key lets an attacker join the DDS graph as an authenticated participant."
condition = '''
payload.filename CONTAINS "/enclaves/" AND payload.filename ENDS_WITH "/key.pem"
AND NOT (
  (header.image STARTS_WITH "/opt/ros/" OR header.image STARTS_WITH "/opt/robot_ws/install/")
  AND NOT header.image CONTAINS "/../"
)
'''

[[rules]]
name = "RoboDR: SROS 2 CA private key accessed on robot"
type = "FileOpened"
category = "credential_access"
severity = "critical"
description = "A keystore CA private key (private/*.key.pem: ca, identity_ca or permissions_ca) was opened on the robot. CA keys must stay on the offline signing station; with them an attacker can mint new identities and permissions for the whole fleet. Any access means the key is present on the unit and is being read."
# Exact SROS 2 file names: "/private/" + "*.key.pem" also matched ordinary TLS
# keys such as /etc/ssl/private/server.key.pem (review note).
condition = '''
payload.filename ENDS_WITH "/private/ca.key.pem"
OR payload.filename ENDS_WITH "/private/identity_ca.key.pem"
OR payload.filename ENDS_WITH "/private/permissions_ca.key.pem"
'''

[[rules]]
name = "RoboDR: SROS 2 keystore file written"
type = "FileOpened"
category = "persistence"
severity = "high"
description = "A file inside an SROS 2 enclave directory (keys, certificates, signed governance or permissions) was opened for writing or truncation. Replacing permissions.p7s/governance.p7s widens what a node may publish; replacing certs or keys swaps its identity. The keystore is provisioned at commissioning and is read-only in the field."
condition = '''
payload.filename CONTAINS "/enclaves/"
AND (payload.filename ENDS_WITH ".pem" OR payload.filename ENDS_WITH ".p7s" OR payload.filename ENDS_WITH ".xml")
AND (payload.flags CONTAINS "O_WRONLY" OR payload.flags CONTAINS "O_RDWR" OR payload.flags CONTAINS "O_TRUNC")
'''

[[rules]]
name = "RoboDR: SROS 2 keystore file renamed or replaced"
type = "FileRename"
category = "persistence"
severity = "high"
description = "A file was renamed into or out of an SROS 2 enclave directory (atomic replacement of keys, certificates, governance or permissions, or moving a key out for exfiltration)."
condition = 'payload.source CONTAINS "/enclaves/" OR payload.destination CONTAINS "/enclaves/"'

[[rules]]
name = "RoboDR: Link created to an SROS 2 private key"
type = "FileLink"
category = "credential_access"
severity = "high"
description = "A hard or symbolic link was created whose target is an SROS 2 private key. Linking a key to an innocuous path is a way to read it without the read showing up under the keystore path. Pulsar FileLink: 'source' is the new link, 'destination' the target (for symlinks, the raw target string, which may be relative)."
condition = 'payload.destination ENDS_WITH "key.pem"'

[[rules]]
name = "RoboDR: Link created inside an SROS 2 enclave directory"
type = "FileLink"
category = "persistence"
severity = "high"
description = "A hard or symbolic link was created inside an SROS 2 enclave directory (e.g. permissions.p7s -> an attacker-signed file, or a key replaced via open(O_TMPFILE)+linkat()). Mirrors the rename rule: a link swaps keys, certificates, governance or permissions without a write-open or rename on the keystore path. Pulsar FileLink: 'source' is the new link."
condition = 'payload.source CONTAINS "/enclaves/"'

[[rules]]
name = "RoboDR: SROS 2 security files loaded from outside the commissioned keystore"
type = "FileOpened"
category = "defense_evasion"
severity = "high"
description = "An SROS 2 enclave file (key.pem, cert.pem, governance.p7s, permissions.p7s or the CA certificates) was read from a keystore other than the commissioned one. ROS_SECURITY_KEYSTORE / ROS_SECURITY_ENCLAVE_OVERRIDE are environment variables Pulsar cannot see; pointing a node at an attacker keystore gives it attacker-signed governance and permissions (e.g. unprotected topics) while it still runs from the trusted /opt/ros image, so the key-reader rule above stays silent. rcl always builds <keystore>/enclaves/<enclave>/, so the /enclaves/ component is reliable."
# TUNE: set the commissioned keystore root (absolute, resolved, with the
# trailing slash). Paths here are kernel-resolved, so a symlink to the real
# keystore resolves to it and does not fire.
condition = '''
payload.filename CONTAINS "/enclaves/"
AND (payload.filename ENDS_WITH "/key.pem" OR payload.filename ENDS_WITH "/cert.pem"
     OR payload.filename ENDS_WITH "/governance.p7s" OR payload.filename ENDS_WITH "/permissions.p7s"
     OR payload.filename ENDS_WITH "/identity_ca.cert.pem" OR payload.filename ENDS_WITH "/permissions_ca.cert.pem")
AND NOT payload.filename STARTS_WITH "/opt/robot_keystore/"
'''
