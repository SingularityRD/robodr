# RoboDR host rules: runtime hooking of the ROS 2 / DDS stack.
#
# Threat: "Seeing is Not Believing" (Shen et al., 2026) -- ONE environment
# variable made Secure ROS 2 load a hook library that forged telemetry and
# control. Pulsar's Exec event has no environment (pulsar-core event.rs
# Payload::Exec = filename, argc, argv), so LD_PRELOAD / RMW_IMPLEMENTATION
# cannot be matched directly. These rules catch the hook where it is visible:
# the dynamic loader OPENING the library (FileOpened), the library being
# written, and the persistent forms (/etc/ld.so.preload, ld.so.conf.d).
#
# Pulsar already ships, and these do not duplicate:
#   privilege_escalation/ld_preload_shared_object_modif.toml  (write/rename of /etc/ld.so.preload)
#   credential_access/credential_dumping.toml  (/proc/*/maps|mem reads, strace -p 1, gcore)
#
# Matching on names is not enough: the loader maps ANY file LD_PRELOAD names,
# whatever it is called (review finding: "/home/robot/.cache/hook" has no
# ".so"). Three layers, strongest first:
#   1. Hardening (not a rule): mount /tmp, /var/tmp, /dev/shm and /run/user
#      noexec -- the kernel then refuses PROT_EXEC mappings from them, so a
#      staged hook cannot be loaded at all (rules/README.md "Deployment").
#   2. ElfOpened rules below: content-based (ELF magic), name-independent.
#      They need `elf_check = true` under [module.file-system-monitor] in
#      pulsar.toml (default false; see rules/README.md for cost and limits).
#   3. FileOpened rules: name-based fallback (*.so / *.so.N) that works with
#      the default Pulsar config. It deliberately does NOT flag plain reads of
#      arbitrary files from /tmp: ros2 launch hands every node a
#      /tmp/launch_params_* file (--params-file), ros2 bag plays from /tmp, and
#      perception nodes read model weights from ~/.cache (re-review finding).
#      A hook WITHOUT a .so name is therefore caught by content (layer 2) or
#      prevented (layer 1) -- elf_check is a deployment requirement, not an
#      option (rules/README.md "Deployment").
#
# update-initramfs (every kernel/firmware upgrade) copies modules and
# libraries into /var/tmp/mkinitramfs_XXXXXX and runs cp, depmod -b,
# ldconfig -r and cpio on that tree as root. The temp-directory rules exclude
# exactly that: uid 0, path under /var/tmp/mkinitramfs_, and the exact image
# of the one tool that touches the tree in that way (rules/README.md
# "Maintenance-time exclusions"). If TMPDIR is set for apt on the robot the
# staging tree moves and these exclusions must follow it (TUNE).
# FileOpened/FileCreated/FileRename paths are kernel-resolved (get_path_str
# walks the dentry), so directory prefixes on payload.filename cannot be
# dodged with "..". header.image is NOT resolved for absolute execs (it is
# bprm->filename verbatim), so exclusions by image use exact paths.
#
# TUNE markers: see ros2_stack.toml.

[[rules]]
name = "RoboDR: ROS 2 process loaded a library from outside the allowlisted library paths"
type = "FileOpened"
category = "defense_evasion"
severity = "high"
description = "A ROS 2 node (ROS install tree, robot workspace, or the Python interpreter that runs rclpy nodes) opened a shared object (*.so, *.so.N) outside the system, ROS and workspace library directories. This is what an LD_PRELOAD or LD_LIBRARY_PATH hook with a library name looks like from the file system: the loader opens the injected file. A hook with any other name is caught by content by the ElfOpened rules (elf_check = true is required) or prevented by noexec staging mounts; plain data reads (ros2 launch --params-file /tmp/launch_params_*, bags, model weights) are not flagged. Pip --user installs under ~/.local also trigger this and should not exist on a fielded unit."
# TUNE: add the robot's vendor SDK library directories to the NOT list.
condition = '''
(header.image STARTS_WITH "/opt/ros/" OR header.image STARTS_WITH "/opt/robot_ws/install/" OR header.image STARTS_WITH "/usr/bin/python3" OR header.image STARTS_WITH "/bin/python3")
AND (payload.filename ENDS_WITH ".so" OR payload.filename CONTAINS ".so.")
AND NOT (
  payload.filename STARTS_WITH "/usr/lib/"
  OR payload.filename STARTS_WITH "/lib/"
  OR payload.filename STARTS_WITH "/usr/lib64/"
  OR payload.filename STARTS_WITH "/lib64/"
  OR payload.filename STARTS_WITH "/usr/local/lib/"
  OR payload.filename STARTS_WITH "/opt/ros/"
  OR payload.filename STARTS_WITH "/opt/robot_ws/install/"
  OR payload.filename == "/etc/ld.so.cache"
  OR payload.filename == "/etc/ld.so.preload"
)
'''

[[rules]]
name = "RoboDR: ROS 2 process mapped an ELF from outside the allowlisted paths"
type = "ElfOpened"
category = "defense_evasion"
severity = "high"
description = "A ROS 2 node opened a file whose content is an ELF object (Pulsar elf_check: magic bytes, not the name) outside the system binary/library, ROS and workspace directories. Catches LD_PRELOAD / LD_LIBRARY_PATH hooks with any file name, including names without .so. Requires elf_check = true in pulsar.toml; the check reads the file after the open, so a hook deleted immediately after loading can be missed."
# TUNE: add the robot's vendor SDK directories to the NOT list.
condition = '''
(header.image STARTS_WITH "/opt/ros/" OR header.image STARTS_WITH "/opt/robot_ws/install/" OR header.image STARTS_WITH "/usr/bin/python3" OR header.image STARTS_WITH "/bin/python3")
AND NOT (
  payload.filename STARTS_WITH "/usr/lib/"
  OR payload.filename STARTS_WITH "/lib/"
  OR payload.filename STARTS_WITH "/usr/lib64/"
  OR payload.filename STARTS_WITH "/lib64/"
  OR payload.filename STARTS_WITH "/usr/local/lib/"
  OR payload.filename STARTS_WITH "/usr/libexec/"
  OR payload.filename STARTS_WITH "/usr/bin/"
  OR payload.filename STARTS_WITH "/bin/"
  OR payload.filename STARTS_WITH "/usr/sbin/"
  OR payload.filename STARTS_WITH "/sbin/"
  OR payload.filename STARTS_WITH "/opt/ros/"
  OR payload.filename STARTS_WITH "/opt/robot_ws/install/"
)
'''

[[rules]]
name = "RoboDR: ELF opened from a world-writable or user cache directory"
type = "ElfOpened"
category = "defense_evasion"
severity = "high"
description = "Any process opened, read-only, an ELF object (by content, not name) from /tmp, /var/tmp, /dev/shm, /run/user, /run/lock, /var/crash or a ~/.cache tree. Hook libraries and implants are staged in user-writable locations under arbitrary names and are loaded read-only. Write opens are not flagged (the async ELF check would otherwise report the assembler writing /tmp/cc*.o and cp filling the initramfs staging tree). update-initramfs reading its own staging tree as root (depmod -b, ldconfig -r, cpio; exact images) is excluded. Linking in one gcc step (and -flto) reads ELF objects from /tmp and still matches. /dev/shm is only seen if elf_check_whitelist does not contain /dev (Pulsar's default does)."
condition = '''
(payload.filename STARTS_WITH "/tmp/" OR payload.filename STARTS_WITH "/var/tmp/" OR payload.filename STARTS_WITH "/dev/shm/"
 OR payload.filename STARTS_WITH "/run/user/" OR payload.filename STARTS_WITH "/run/lock/" OR payload.filename STARTS_WITH "/var/crash/"
 OR payload.filename CONTAINS "/.cache/")
AND payload.flags CONTAINS "O_RDONLY"
AND NOT (
  header.uid == 0
  AND payload.filename STARTS_WITH "/var/tmp/mkinitramfs_"
  AND (header.image == "/usr/sbin/depmod" OR header.image == "/sbin/depmod"
       OR header.image == "/usr/sbin/ldconfig" OR header.image == "/sbin/ldconfig"
       OR header.image == "/usr/sbin/ldconfig.real" OR header.image == "/sbin/ldconfig.real"
       OR header.image == "/usr/bin/cpio" OR header.image == "/bin/cpio")
)
'''

[[rules]]
name = "RoboDR: ROS 2 process loaded /etc/ld.so.preload"
type = "FileOpened"
category = "defense_evasion"
severity = "high"
description = "A ROS 2 process opened /etc/ld.so.preload. glibc's loader only opens this file when it exists, so every ROS node start will report this while a system-wide preload is installed: every node is running with an injected library (persistent form of the one-env-var hook)."
condition = '''
payload.filename == "/etc/ld.so.preload"
AND (header.image STARTS_WITH "/opt/ros/" OR header.image STARTS_WITH "/opt/robot_ws/install/" OR header.image STARTS_WITH "/usr/bin/python3" OR header.image STARTS_WITH "/bin/python3")
'''

[[rules]]
name = "RoboDR: Unexpected ROS 2 middleware (RMW) library loaded"
type = "FileOpened"
category = "defense_evasion"
severity = "high"
description = "A process opened an RMW implementation library that is not the one commissioned for this robot. RMW_IMPLEMENTATION is an environment variable that selects which librmw_*.so rmw_implementation dlopen()s; pointing it at a malicious RMW gives full read/write over every topic, below SROS 2. Default allowlist is Fast DDS (rmw_fastrtps_cpp) plus the shared helper libraries, and only from the dpkg-managed /opt/ros tree: a rogue RMW that borrows an allowlisted file name elsewhere still fires."
# TUNE: set the allowlist to the robot's RMW (e.g. librmw_cyclonedds_cpp.so)
# and verify the library names against the installed ROS distro.
condition = '''
payload.filename CONTAINS "/librmw_" AND payload.filename ENDS_WITH ".so"
AND NOT (
  payload.filename STARTS_WITH "/opt/ros/"
  AND (
    payload.filename ENDS_WITH "/lib/librmw_implementation.so"
    OR payload.filename ENDS_WITH "/lib/librmw_dds_common.so"
    OR payload.filename ENDS_WITH "/lib/librmw_security_common.so"
    OR payload.filename ENDS_WITH "/lib/librmw_fastrtps_cpp.so"
    OR payload.filename ENDS_WITH "/lib/librmw_fastrtps_shared_cpp.so"
  )
)
'''

[[rules]]
name = "RoboDR: Shared library opened from a temporary directory"
type = "FileOpened"
category = "defense_evasion"
severity = "high"
description = "A shared object was opened read-only (as the dynamic loader does) from /tmp, /var/tmp, /dev/shm, /run/user, /run/lock or /var/crash (the world-writable directories of a stock Ubuntu image). Hook libraries are staged in world-writable locations; legitimate robot software loads libraries from package-managed paths. Writes are not flagged (the later load is). update-initramfs reading its staging tree as root (ldconfig -r, cpio; exact images) is excluded. Self-extracting bundles (PyInstaller onefile, some vendor installers) also match."
condition = '''
(payload.filename STARTS_WITH "/tmp/" OR payload.filename STARTS_WITH "/var/tmp/" OR payload.filename STARTS_WITH "/dev/shm/" OR payload.filename STARTS_WITH "/run/user/"
 OR payload.filename STARTS_WITH "/run/lock/" OR payload.filename STARTS_WITH "/var/crash/")
AND (payload.filename ENDS_WITH ".so" OR payload.filename CONTAINS ".so.")
AND payload.flags CONTAINS "O_RDONLY"
AND NOT (
  header.uid == 0
  AND payload.filename STARTS_WITH "/var/tmp/mkinitramfs_"
  AND (header.image == "/usr/sbin/ldconfig" OR header.image == "/sbin/ldconfig"
       OR header.image == "/usr/sbin/ldconfig.real" OR header.image == "/sbin/ldconfig.real"
       OR header.image == "/usr/bin/cpio" OR header.image == "/bin/cpio")
)
'''

[[rules]]
name = "RoboDR: Program executed from a temporary directory"
type = "Exec"
category = "execution"
severity = "high"
description = "A program was executed from /tmp, /var/tmp, /dev/shm, /run/user, /run/lock or /var/crash. Droppers and implants run from world-writable staging directories; fielded robot software does not. The exec path is matched as passed to execve (not resolved): '/usr/../tmp/x' and '//tmp/x' are caught by the non-canonical-path rule, a symlinked directory is not caught at all, so mount these directories noexec."
condition = '''
payload.filename STARTS_WITH "/tmp/" OR payload.filename STARTS_WITH "/var/tmp/" OR payload.filename STARTS_WITH "/dev/shm/" OR payload.filename STARTS_WITH "/run/user/"
OR payload.filename STARTS_WITH "/run/lock/" OR payload.filename STARTS_WITH "/var/crash/"
'''

[[rules]]
name = "RoboDR: Shared library written into a system library path outside the package manager"
type = "FileCreated"
category = "persistence"
severity = "high"
description = "A file was created under /usr/lib, /lib, /usr/lib64, /lib64 or /usr/local/lib by something other than dpkg (exact image /usr/bin/dpkg or /bin/dpkg). A hook placed in a trusted library directory evades the 'library outside allowlisted paths' rules, and the loader does not care about the name, so ANY new file there is flagged, not only *.so. depmod (exact image) writing its modules.* index files under /lib/modules/<version>/ is excluded (every kernel upgrade). Byte-compiling Python as root (py3compile in a postinst, a root-run node importing a module without a .pyc) also creates files here; this is deliberately NOT excluded, because a forged .pyc in dist-packages is itself a code hook. Precompile at commissioning."
condition = '''
(payload.filename STARTS_WITH "/usr/lib/" OR payload.filename STARTS_WITH "/lib/" OR payload.filename STARTS_WITH "/usr/local/lib/"
 OR payload.filename STARTS_WITH "/usr/lib64/" OR payload.filename STARTS_WITH "/lib64/")
AND NOT (header.image == "/usr/bin/dpkg" OR header.image == "/bin/dpkg")
AND NOT (
  (header.image == "/usr/sbin/depmod" OR header.image == "/sbin/depmod")
  AND (payload.filename STARTS_WITH "/usr/lib/modules/" OR payload.filename STARTS_WITH "/lib/modules/")
  AND payload.filename CONTAINS "/modules."
)
'''

[[rules]]
name = "RoboDR: File moved into a system library path or linker configuration outside the package manager"
type = "FileRename"
category = "persistence"
severity = "high"
description = "A file was renamed into /usr/lib, /lib, /usr/lib64, /lib64, /usr/local/lib, /etc/ld.so.conf or /etc/ld.so.conf.d by something other than dpkg. Creating a file elsewhere and renaming it in produces no FileCreated/FileOpened event on the target path, so the creation and write rules alone miss it. depmod (exact image) renaming its modules.*.tmp index files into place is excluded."
condition = '''
(payload.destination STARTS_WITH "/usr/lib/" OR payload.destination STARTS_WITH "/lib/" OR payload.destination STARTS_WITH "/usr/local/lib/"
 OR payload.destination STARTS_WITH "/usr/lib64/" OR payload.destination STARTS_WITH "/lib64/"
 OR payload.destination == "/etc/ld.so.conf" OR payload.destination STARTS_WITH "/etc/ld.so.conf.d/")
AND NOT (header.image == "/usr/bin/dpkg" OR header.image == "/bin/dpkg")
AND NOT (
  (header.image == "/usr/sbin/depmod" OR header.image == "/sbin/depmod")
  AND (payload.destination STARTS_WITH "/usr/lib/modules/" OR payload.destination STARTS_WITH "/lib/modules/")
  AND payload.destination CONTAINS "/modules."
)
'''

[[rules]]
name = "RoboDR: Link created in a system library path or linker configuration outside the package manager"
type = "FileLink"
category = "persistence"
severity = "high"
description = "A hard or symbolic link was created in /usr/lib, /lib, /usr/lib64, /lib64, /usr/local/lib, or as /etc/ld.so.conf or a file in /etc/ld.so.conf.d, by something other than dpkg. A symlink 'libfoo.so.1 -> /home/x/hook' or a hard link of a staged file puts a hook where every library allowlist trusts it, and open(O_TMPFILE)+linkat() materialises a file there with no FileCreated or rename event at all. ldconfig (exact images) creating its soname symlinks is excluded only for symlinks whose target is a bare file name in the same directory (that is all ldconfig ever creates). Pulsar FileLink: 'source' is the new link, 'destination' the target (raw string for symlinks)."
condition = '''
(payload.source STARTS_WITH "/usr/lib/" OR payload.source STARTS_WITH "/lib/" OR payload.source STARTS_WITH "/usr/local/lib/"
 OR payload.source STARTS_WITH "/usr/lib64/" OR payload.source STARTS_WITH "/lib64/"
 OR payload.source == "/etc/ld.so.conf" OR payload.source STARTS_WITH "/etc/ld.so.conf.d/")
AND NOT (header.image == "/usr/bin/dpkg" OR header.image == "/bin/dpkg")
AND NOT (
  payload.hard_link == "false"
  AND NOT payload.destination CONTAINS "/"
  AND NOT payload.source STARTS_WITH "/etc/"
  AND (header.image == "/sbin/ldconfig.real" OR header.image == "/usr/sbin/ldconfig.real"
       OR header.image == "/sbin/ldconfig" OR header.image == "/usr/sbin/ldconfig")
)
'''

[[rules]]
name = "RoboDR: Existing file in a system library path opened for writing outside the package manager"
type = "FileOpened"
category = "persistence"
severity = "high"
description = "A file under /usr/lib, /lib, /usr/lib64, /lib64 or /usr/local/lib was opened for writing WITHOUT O_CREAT by something other than dpkg: an in-place overwrite of an existing library ('cp hook.so /usr/lib/.../libfoo.so.1' over the real one opens it O_WRONLY|O_TRUNC and raises no FileCreated), or an open(O_TMPFILE) in a library directory that will be linkat()ed into place. dpkg never writes installed files in place (it writes *.dpkg-new and renames). New files are the FileCreated rule's job."
condition = '''
(payload.filename STARTS_WITH "/usr/lib/" OR payload.filename STARTS_WITH "/lib/" OR payload.filename STARTS_WITH "/usr/local/lib/"
 OR payload.filename STARTS_WITH "/usr/lib64/" OR payload.filename STARTS_WITH "/lib64/")
AND (payload.flags CONTAINS "O_WRONLY" OR payload.flags CONTAINS "O_RDWR")
AND NOT payload.flags CONTAINS "O_CREAT"
AND NOT (header.image == "/usr/bin/dpkg" OR header.image == "/bin/dpkg")
'''

[[rules]]
name = "RoboDR: Dynamic linker search path changed"
type = "FileOpened"
category = "persistence"
severity = "high"
description = "/etc/ld.so.conf or a file in /etc/ld.so.conf.d was opened for writing by something other than dpkg (exact image /usr/bin/dpkg or /bin/dpkg; a binary merely named dpkg does not count). Adding a directory to the linker search path lets a planted library shadow a real one for every ROS node (LD_LIBRARY_PATH made persistent)."
condition = '''
(payload.filename == "/etc/ld.so.conf" OR payload.filename STARTS_WITH "/etc/ld.so.conf.d/")
AND (payload.flags CONTAINS "O_WRONLY" OR payload.flags CONTAINS "O_RDWR")
AND NOT (header.image == "/usr/bin/dpkg" OR header.image == "/bin/dpkg")
'''

[[rules]]
name = "RoboDR: Process memory written through /proc"
type = "FileOpened"
category = "defense_evasion"
severity = "high"
description = "/proc/<pid>/mem was opened for writing. This is code injection into a running process (MITRE T1055.009) without ptrace attach -- e.g. patching a running ROS node's publisher or controller in memory. Pulsar has no ptrace event; debuggers (gdb) also write here and should not run on a fielded unit."
condition = '''
payload.filename STARTS_WITH "/proc/" AND payload.filename ENDS_WITH "/mem"
AND (payload.flags CONTAINS "O_WRONLY" OR payload.flags CONTAINS "O_RDWR")
'''

[[rules]]
name = "RoboDR: Debugger or tracer started on robot controller"
type = "Exec"
category = "credential_access"
severity = "medium"
description = "gdb, gdbserver, strace, ltrace or frida was executed. These attach to running processes with ptrace and can read keys out of, or patch, ROS nodes. Pulsar has no ptrace event, so the tool's execution is the observable."
condition = '''
payload.filename ENDS_WITH "/gdb" OR payload.filename ENDS_WITH "/gdbserver" OR payload.filename ENDS_WITH "/strace"
OR payload.filename ENDS_WITH "/ltrace" OR payload.filename ENDS_WITH "/frida" OR payload.filename ENDS_WITH "/frida-server"
'''

# ---------------------------------------------------------------------------
# Exec-path evasions. payload.filename (and therefore header.image of the new
# process) is bprm->filename verbatim for absolute paths: not normalised, not
# symlink-resolved. Every rule that scopes or excludes by an exec path can be
# side-stepped by spelling the path differently, so these two rules make the
# respelling itself the signal.

[[rules]]
name = "RoboDR: Program executed from a file descriptor or /proc path"
type = "Exec"
category = "defense_evasion"
severity = "high"
description = "A program was executed through /dev/fd/N (fexecve/execveat on an fd, including memfd_create 'fileless' payloads) or a /proc path (/proc/self/exe, /proc/<pid>/exe, /proc/<pid>/fd/N, /proc/<pid>/root/...). The new process has an image path that names no file on disk, so every path-scoped rule (ROS-node scope, temp-dir exec, allowlists) is blind to it. systemd >= 255 starts every unit through its pinned systemd-executor as /proc/self/fd/N; that form is excluded for the system manager (root, parent PID 1) and for the user managers of the commissioned service accounts (see the TUNE note)."
# TUNE: systemd >= 255 execs '/proc/self/fd/N' with argv
# [/usr/lib/systemd/systemd-executor, --deserialize, N, ...] for every unit,
# from PID 1 (system units, uid 0) AND from every 'systemd --user' manager
# (user units: uid = the account, parent = that account's manager, not PID 1).
# Exclusion 1 (system manager): uid 0 and parent PID 1. Exclusion 2 (user
# managers): ONLY the uids listed below -- the robot's service accounts that
# run ROS under 'systemd --user' (lingering). Default 1000, the first account
# on an Ubuntu image; set it to the commissioned uid(s) and delete it if no
# user manager runs on the robot. Every other uid, and root's own user
# manager (user@0, parent is not PID 1), still fires.
# Both exclusions trust argv (attacker-chosen): root can mimic #1 by double
# forking to PID 1, and code already running as a listed uid can mimic #2
# with fexecve + a copied argv. Pulsar has no parent image to tell the real
# manager apart. On systemd < 255 delete both. Container runtimes (runc
# re-execs /proc/self/exe) also match: exclude them only if the robot runs
# containers.
condition = '''
(payload.filename STARTS_WITH "/dev/fd/" OR payload.filename STARTS_WITH "/proc/")
AND NOT (
  payload.filename STARTS_WITH "/proc/self/fd/"
  AND payload.argv CONTAINS "/usr/lib/systemd/systemd-executor"
  AND payload.argv CONTAINS "--deserialize"
  AND (
    (header.parent_pid == 1 AND header.uid == 0)
    OR (header.parent_pid != 1 AND header.uid == 1000)
  )
)
'''

[[rules]]
name = "RoboDR: Program executed through a non-canonical path"
type = "Exec"
category = "defense_evasion"
severity = "medium"
description = "A program was executed with an absolute path containing '/../', '/./' or '//'. The kernel resolves it, but Pulsar records it verbatim and RoboDR rules scope by these strings: '/opt//ros/humble/lib/x/node' runs a real ROS node that the ROS-node rules (library allowlist, outbound connect, Python import) no longer recognise, and '/usr/../tmp/implant' is not 'under /tmp'. Normal launchers (ros2 launch, systemd, shells resolving PATH) produce canonical paths."
# TUNE: shell scripts that exec "$(dirname "$0")/../bin/tool" produce '/../';
# fix the script or exclude that exact filename.
condition = '''
payload.filename CONTAINS "/../" OR payload.filename CONTAINS "/./" OR payload.filename CONTAINS "//"
'''

# ---------------------------------------------------------------------------
# Hooks that are not ELF libraries.

[[rules]]
name = "RoboDR: ROS 2 process imported Python code from outside the allowlisted paths"
type = "FileOpened"
category = "defense_evasion"
severity = "high"
description = "A ROS 2 node or the Python interpreter read a Python source or bytecode file, or a site-packages/dist-packages .pth file, outside the system Python, ROS and workspace trees. This is the Python form of the one-environment-variable hook: PYTHONPATH, PYTHONHOME, PYTHONSTARTUP (*.py), a user site-packages directory (~/.local) or a planted sitecustomize/usercustomize/.pth runs attacker code INSIDE a trusted rclpy node (or the ros2 CLI), which then reads keys or publishes under that node's identity and its trusted /opt/ros image path. No ELF is loaded, so the library rules cannot see it. Python only executes .pth files found directly in a site directory, so .pth is matched only under */site-packages/ or */dist-packages/: PyTorch weights (*.pth in ~/.cache/torch) are data and do not match."
# TUNE: add the robot's own Python package directories to the NOT list.
condition = '''
(header.image STARTS_WITH "/opt/ros/" OR header.image STARTS_WITH "/opt/robot_ws/install/" OR header.image STARTS_WITH "/usr/bin/python3" OR header.image STARTS_WITH "/bin/python3")
AND (
  payload.filename ENDS_WITH ".py" OR payload.filename ENDS_WITH ".pyc"
  OR (payload.filename ENDS_WITH ".pth" AND (payload.filename CONTAINS "/site-packages/" OR payload.filename CONTAINS "/dist-packages/"))
)
AND payload.flags CONTAINS "O_RDONLY"
AND NOT (
  payload.filename STARTS_WITH "/usr/lib/python3"
  OR payload.filename STARTS_WITH "/usr/local/lib/python3"
  OR payload.filename STARTS_WITH "/usr/share/"
  OR payload.filename STARTS_WITH "/opt/ros/"
  OR payload.filename STARTS_WITH "/opt/robot_ws/install/"
)
'''

[[rules]]
name = "RoboDR: Interpreter one-liner executed"
type = "Exec"
category = "execution"
severity = "medium"
description = "python, perl, ruby, node or php was run with inline code (-c, -e, -E, --eval, -r and common bundles such as -Ic, -we, -wle). Reverse shells and pty upgrades (python3 -c 'import pty; pty.spawn(...)', perl -e ...) take this form, and the shell they spawn usually has no -i, so the interactive-shell rule does not see it. Fielded robot software runs scripts from files. CMake 3.28's FindPython probes (/usr/bin/python3, python3.10 or python3.12 with exactly '-c' and one of 17 known probe texts, argc 3) are excluded; two more probe texts cannot be (one contains a double quote, one a backslash; rules/README.md) and still fire during a colcon build on the unit. Known false positives: those two probes, other CMake versions' probes, python3 -E (ignore environment) and node -r (preload) running a script file. Known misses: code glued to the option ('-cimport os', '-e'print'') and bundles not listed, because argv CONTAINS can only compare whole elements."
# Shells with -c are deliberately not covered: system()/popen() run 'sh -c'
# constantly.
#
# CMake FindPython exclusion (CMake 3.28.3, Modules/FindPython/Support.cmake;
# verified by tracing a real configure with strace). Every probe is
#   execve("<interpreter>", ["<interpreter>", "-c", "<probe text>"])
# so the exclusion pins ALL of it: argc == 3, the exec path AND argv[0] equal
# to one of the exact system interpreters, the element "-c", and the probe
# text as one whole argv element (Argv CONTAINS is exact-element equality, so
# appending code to a probe text breaks the match). With argc pinned, the
# three named elements are the whole argv: there is no slot left for code.
# argv[0] is pinned too because CPython derives sys.prefix (and so the
# site-packages it imports from, and any pyvenv.cfg it honours) from it.
# 19 distinct probe texts exist in 3.28 (${_scheme} is always 'posix_prefix'
# on Linux; ${config_flag} takes ABIFLAGS, LIBPL and LIBS). 17 are excluded
# below. Not expressible / not excluded:
#   * 'import sys, struct; sys.stdout.write(str(struct.calcsize("P")))'
#     contains a double quote; the DSL literal regex has no way to put one
#     in a value (escapes are kept verbatim, never unescaped).
#   * the SOSABI probe ("...re.search('^\.abi', x)...") contains a backslash.
#     The engine would keep it verbatim (which is what argv holds), but
#     scripts/validate_rules.py --strict rejects every backslash in a literal
#     as a probable mistaken escape, so it is left out rather than weakening
#     the validator.
# Both still fire during a configure (benign corpus allow-lists them).
# Not covered: other CMake versions (texts change between releases), a
# CMAKE_CROSSCOMPILING_EMULATOR / interpreter launcher (argv[0] becomes the
# launcher), venv or /usr/local interpreters, and interpreter-affecting
# environment variables, which Pulsar does not capture (rules/README.md,
# residual gaps). TUNE: exclude other exact helper invocations found during
# commissioning the same way: argc pinned and every argv element named.
condition = """
(payload.filename ENDS_WITH "/python" OR payload.filename ENDS_WITH "/python3" OR payload.filename CONTAINS "/python3."
 OR payload.filename ENDS_WITH "/python2" OR payload.filename CONTAINS "/python2."
 OR payload.filename ENDS_WITH "/perl" OR payload.filename CONTAINS "/perl5" OR payload.filename ENDS_WITH "/ruby"
 OR payload.filename ENDS_WITH "/node" OR payload.filename ENDS_WITH "/nodejs" OR payload.filename ENDS_WITH "/php" OR payload.filename CONTAINS "/php8")
AND (
  payload.argv CONTAINS "-c" OR payload.argv CONTAINS "-Ic" OR payload.argv CONTAINS "-Sc" OR payload.argv CONTAINS "-uc"
  OR payload.argv CONTAINS "-Bc" OR payload.argv CONTAINS "-Ec" OR payload.argv CONTAINS "-sc" OR payload.argv CONTAINS "-Esc"
  OR payload.argv CONTAINS "-e" OR payload.argv CONTAINS "-ne" OR payload.argv CONTAINS "-pe" OR payload.argv CONTAINS "-le"
  OR payload.argv CONTAINS "-lne" OR payload.argv CONTAINS "-E" OR payload.argv CONTAINS "--eval" OR payload.argv CONTAINS "-r"
  OR payload.argv CONTAINS "-Oc" OR payload.argv CONTAINS "-OOc" OR payload.argv CONTAINS "-qc" OR payload.argv CONTAINS "-bc"
  OR payload.argv CONTAINS "-Pc" OR payload.argv CONTAINS "-IPc" OR payload.argv CONTAINS "-ISc" OR payload.argv CONTAINS "-Euc"
  OR payload.argv CONTAINS "-we" OR payload.argv CONTAINS "-wle" OR payload.argv CONTAINS "-lwe" OR payload.argv CONTAINS "-wne"
  OR payload.argv CONTAINS "-wpe" OR payload.argv CONTAINS "-wlne" OR payload.argv CONTAINS "-wlpe" OR payload.argv CONTAINS "-ane"
  OR payload.argv CONTAINS "-lane" OR payload.argv CONTAINS "-wE" OR payload.argv CONTAINS "-wlE" OR payload.argv CONTAINS "-nE"
  OR payload.argv CONTAINS "-lE" OR payload.argv CONTAINS "-Te" OR payload.argv CONTAINS "-tE"
)
AND NOT (
  payload.argc == 3 AND payload.argv CONTAINS "-c"
  AND (
    (payload.filename == "/usr/bin/python3" AND payload.argv CONTAINS "/usr/bin/python3")
    OR (payload.filename == "/usr/bin/python3.10" AND payload.argv CONTAINS "/usr/bin/python3.10")
    OR (payload.filename == "/usr/bin/python3.12" AND payload.argv CONTAINS "/usr/bin/python3.12")
  )
  AND (
    payload.argv CONTAINS "import sys\ntry:\n   import sysconfig\n   sys.stdout.write(';'.join([sysconfig.get_config_var('base') or '', sysconfig.get_config_var('installed_base') or '']))\nexcept Exception:\n   from distutils import sysconfig\n   sys.stdout.write(';'.join([sysconfig.PREFIX,sysconfig.EXEC_PREFIX,sysconfig.BASE_EXEC_PREFIX]))"
    OR payload.argv CONTAINS "import sys\ntry:\n   import sysconfig\n   sys.stdout.write(';'.join([sysconfig.get_path('platinclude'),sysconfig.get_path('platinclude','posix_prefix'),sysconfig.get_path('include'),sysconfig.get_path('include','posix_prefix')]))\nexcept Exception:\n   from distutils import sysconfig\n   sys.stdout.write(';'.join([sysconfig.get_python_inc(plat_specific=True),sysconfig.get_python_inc(plat_specific=False)]))"
    OR payload.argv CONTAINS "import sys\ntry:\n   import sysconfig\n   sys.stdout.write(sysconfig.get_config_var('EXT_SUFFIX') or '')\nexcept Exception:\n   from distutils import sysconfig;sys.stdout.write(sysconfig.get_config_var('EXT_SUFFIX') or '')"
    OR payload.argv CONTAINS "import sys\ntry:\n   import sysconfig\n   sys.stdout.write(';'.join([sysconfig.get_config_var('SOABI') or '',sysconfig.get_config_var('SO') or '']))\nexcept Exception:\n   from distutils import sysconfig;sys.stdout.write(';'.join([sysconfig.get_config_var('SOABI') or '',sysconfig.get_config_var('SO') or '']))"
    OR payload.argv CONTAINS "import sys\ntry:\n   import sysconfig\n   sys.stdout.write(sysconfig.get_config_var('ABIFLAGS'))\nexcept Exception:\n   from distutils import sysconfig\n   sys.stdout.write(sysconfig.get_config_var('ABIFLAGS'))"
    OR payload.argv CONTAINS "import sys\ntry:\n   import sysconfig\n   sys.stdout.write(sysconfig.get_config_var('LIBPL'))\nexcept Exception:\n   from distutils import sysconfig\n   sys.stdout.write(sysconfig.get_config_var('LIBPL'))"
    OR payload.argv CONTAINS "import sys\ntry:\n   import sysconfig\n   sys.stdout.write(sysconfig.get_config_var('LIBS'))\nexcept Exception:\n   from distutils import sysconfig\n   sys.stdout.write(sysconfig.get_config_var('LIBS'))"
    OR payload.argv CONTAINS "import sys; sys.stdout.write(sys.abiflags)"
    OR payload.argv CONTAINS "import sys; sys.stdout.write('.'.join([str(x) for x in sys.version_info[:3]]))"
    OR payload.argv CONTAINS "import sys; sys.stdout.write(str(sys.version_info[0]))"
    OR payload.argv CONTAINS "import sys, sysconfig; sys.stdout.write(sysconfig.get_platform())"
    OR payload.argv CONTAINS "import sys; sys.stdout.write(str(sys.maxsize > 2**32))"
    OR payload.argv CONTAINS "import sys; import sysconfig; sys.stdout.write(sysconfig.get_platform())"
    OR payload.argv CONTAINS "import sys; sys.stdout.write(sys.copyright)"
    OR payload.argv CONTAINS "import sys\nif sys.version_info >= (3,10):\n   import sysconfig\n   sys.stdout.write(';'.join([sysconfig.get_path('stdlib'),sysconfig.get_path('platstdlib'),sysconfig.get_path('purelib'),sysconfig.get_path('platlib')]))\nelse:\n   from distutils import sysconfig\n   sys.stdout.write(';'.join([sysconfig.get_python_lib(plat_specific=False,standard_lib=True),sysconfig.get_python_lib(plat_specific=True,standard_lib=True),sysconfig.get_python_lib(plat_specific=False,standard_lib=False),sysconfig.get_python_lib(plat_specific=True,standard_lib=False)]))"
    OR payload.argv CONTAINS "import sys\ntry: import numpy; sys.stdout.write(numpy.get_include())\nexcept:pass\n"
    OR payload.argv CONTAINS "import sys\ntry: import numpy; sys.stdout.write(numpy.__version__)\nexcept:pass\n"
  )
)
"""

[[rules]]
name = "RoboDR: Interactive or stdin-fed Python interpreter started"
type = "Exec"
category = "execution"
severity = "medium"
description = "A Python interpreter was started interactively (-i or a bundle such as -iu/-Ii/-qi, or with no arguments at all) or told to read its program from stdin ('-'). The REPL and stdin programs run code that never touches the file system or argv, so the import and one-liner rules cannot see it; with a pty this is how arbitrary code runs inside a trusted interpreter. Fielded robot software runs scripts from files. The '-' arm excludes py3compile's worker ('python3.X -m py_compile -', every apt run that ships Python); adding '-m' and 'py_compile' elements to a stdin program evades it. PYTHONINSPECT=1 (the env-var form of -i) is invisible here: see the pty-wrapper and login-shell rules and rules/README.md."
condition = '''
(payload.filename ENDS_WITH "/python" OR payload.filename ENDS_WITH "/python3" OR payload.filename CONTAINS "/python3."
 OR payload.filename ENDS_WITH "/python2" OR payload.filename CONTAINS "/python2.")
AND (
  payload.argc == 1
  OR payload.argv CONTAINS "-i" OR payload.argv CONTAINS "-iu" OR payload.argv CONTAINS "-ui" OR payload.argv CONTAINS "-Ii"
  OR payload.argv CONTAINS "-iI" OR payload.argv CONTAINS "-qi" OR payload.argv CONTAINS "-iq" OR payload.argv CONTAINS "-Ei"
  OR payload.argv CONTAINS "-iE" OR payload.argv CONTAINS "-Si" OR payload.argv CONTAINS "-iS" OR payload.argv CONTAINS "-Bi"
  OR payload.argv CONTAINS "-iB" OR payload.argv CONTAINS "-ic" OR payload.argv CONTAINS "-im"
  OR (payload.argv CONTAINS "-" AND NOT (payload.argv CONTAINS "-m" AND payload.argv CONTAINS "py_compile"))
)
'''

[[rules]]
name = "RoboDR: Pseudo-terminal wrapper executed on robot controller"
type = "Exec"
category = "execution"
severity = "medium"
description = "script, expect, unbuffer, empty, screen, tmux or dtach was executed. These give a program a pseudo-terminal without a login. The PYTHONINSPECT=1 attack (re-review finding) needs exactly that: 'PYTHONINSPECT=1 script -qc /opt/ros/humble/bin/ros2 /dev/null' drops into a Python prompt INSIDE the trusted /opt/ros image after the CLI exits, where it can read enclave keys under the allowlisted image. Reverse-shell pty upgrades use the same tools. Fielded units run no terminal multiplexers. Executables with these names inside the ROS and workspace install trees are not matched."
condition = '''
(payload.filename ENDS_WITH "/script" OR payload.filename ENDS_WITH "/expect" OR payload.filename ENDS_WITH "/unbuffer"
 OR payload.filename ENDS_WITH "/empty" OR payload.filename ENDS_WITH "/screen" OR payload.filename ENDS_WITH "/tmux"
 OR payload.filename ENDS_WITH "/dtach")
AND NOT (payload.filename STARTS_WITH "/opt/ros/" OR payload.filename STARTS_WITH "/opt/robot_ws/install/")
'''

# ---------------------------------------------------------------------------
# Every write rule trusts the exact image /usr/bin/dpkg. Code injected into
# the real dpkg (LD_PRELOAD=/x/hook /usr/bin/dpkg --version) runs with that
# image and could write a .ko, a library or a ROS node unflagged. These two
# rules watch what dpkg itself loads.

[[rules]]
name = "RoboDR: Package manager loaded a library from outside the system library paths"
type = "FileOpened"
category = "defense_evasion"
severity = "high"
description = "dpkg (exact image /usr/bin/dpkg or /bin/dpkg, the image every RoboDR write rule trusts) opened a shared object read-only outside /usr/lib, /lib, /usr/lib64, /lib64 and /opt/ros. dpkg links only against system libraries; anything else is an LD_PRELOAD/LD_LIBRARY_PATH hook borrowing dpkg's trusted image to write kernel modules, libraries or ROS nodes without an alert. 'dpkg --verify' of a package that ships .so files elsewhere also matches."
condition = '''
(header.image == "/usr/bin/dpkg" OR header.image == "/bin/dpkg")
AND (payload.filename ENDS_WITH ".so" OR payload.filename CONTAINS ".so.")
AND payload.flags CONTAINS "O_RDONLY"
AND NOT (
  payload.filename STARTS_WITH "/usr/lib/" OR payload.filename STARTS_WITH "/lib/"
  OR payload.filename STARTS_WITH "/usr/lib64/" OR payload.filename STARTS_WITH "/lib64/"
  OR payload.filename STARTS_WITH "/opt/ros/"
)
'''

[[rules]]
name = "RoboDR: Package manager mapped an ELF from outside the system paths"
type = "ElfOpened"
category = "defense_evasion"
severity = "high"
description = "dpkg (exact image) opened, read-only, a file whose content is ELF outside the system binary/library directories and /opt/ros. Same threat as the rule above for a hook with any file name. Requires elf_check = true. 'dpkg --verify' of packages that install ELF files elsewhere also matches."
condition = '''
(header.image == "/usr/bin/dpkg" OR header.image == "/bin/dpkg")
AND payload.flags CONTAINS "O_RDONLY"
AND NOT (
  payload.filename STARTS_WITH "/usr/lib/" OR payload.filename STARTS_WITH "/lib/"
  OR payload.filename STARTS_WITH "/usr/lib64/" OR payload.filename STARTS_WITH "/lib64/"
  OR payload.filename STARTS_WITH "/usr/libexec/" OR payload.filename STARTS_WITH "/usr/bin/" OR payload.filename STARTS_WITH "/bin/"
  OR payload.filename STARTS_WITH "/usr/sbin/" OR payload.filename STARTS_WITH "/sbin/"
  OR payload.filename STARTS_WITH "/opt/ros/"
)
'''
